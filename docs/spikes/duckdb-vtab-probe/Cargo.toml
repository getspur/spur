[package]
name = "duckdb-vtab-probe"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
duckdb = { version = "=1.10502.0", features = ["bundled", "vtab"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
