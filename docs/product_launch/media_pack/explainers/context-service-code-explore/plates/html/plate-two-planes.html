<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>plate-two-planes</title>
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0d0d0d}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080" data-capture="true" data-capture-duration-sec="13"></canvas>
<script>
const W=1920,H=1080,DUR=13;
const BG='#0d0d0d', SURF='#141414', CYAN='#00D4AA', TEXT='#f2f2f2', MUTED='#9a9a9a', ACCENT2='#7aa2ff';
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
function clamp(t){return Math.max(0,Math.min(1,t))}
function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function chip(x,y,w,h,label,color,alpha){
  ctx.save();ctx.globalAlpha=alpha;
  ctx.fillStyle='rgba(255,255,255,0.04)';
  ctx.strokeStyle=color;ctx.lineWidth=1.5;
  roundRect(x,y,w,h,10);ctx.fill();ctx.stroke();
  ctx.fillStyle=TEXT;ctx.font='600 20px ui-monospace,Menlo,monospace';
  ctx.textAlign='left';ctx.fillText(label,x+18,y+h/2+7);
  ctx.restore();
}

window.__draw=function(tSec){
  const p=clamp(tSec/DUR);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=TEXT;ctx.font='700 42px ui-sans-serif,system-ui,sans-serif';
  ctx.textAlign='left';ctx.fillText('Two planes, cleanly separated',80,90);
  ctx.fillStyle=MUTED;ctx.font='500 22px ui-sans-serif,system-ui,sans-serif';
  ctx.fillText('Same graph-first workflow — different identity space',80,130);

  const slide=ease(clamp(p/0.25));
  const leftX=80-40*(1-slide);
  const rightX=1000+40*(1-slide);
  const a=slide;

  // left panel worktree
  ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle=SURF;ctx.strokeStyle='rgba(0,212,170,0.35)';ctx.lineWidth=2;
  roundRect(leftX,180,840,780,18);ctx.fill();ctx.stroke();
  ctx.fillStyle=CYAN;ctx.font='700 14px ui-sans-serif,system-ui,sans-serif';
  ctx.fillText('WORKTREE',leftX+36,220);
  ctx.fillStyle=TEXT;ctx.font='700 36px ui-sans-serif,system-ui,sans-serif';
  ctx.fillText('This repository',leftX+36,280);
  ctx.fillStyle=MUTED;ctx.font='500 22px ui-sans-serif,system-ui,sans-serif';
  ctx.fillText('What\'s in this repo?',leftX+36,320);

  const toolsL=['knowledge_context_pack_2','code_symbol_search','code_read_symbol','code_callers / code_callees'];
  toolsL.forEach((t,i)=>{
    const appear=ease(clamp((p-0.2-i*0.06)/0.15));
    chip(leftX+36,380+i*90,760,64,t,CYAN,appear);
  });
  ctx.restore();

  // right panel external
  ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle=SURF;ctx.strokeStyle='rgba(122,162,255,0.4)';ctx.lineWidth=2;
  roundRect(rightX,180,840,780,18);ctx.fill();ctx.stroke();
  ctx.fillStyle=ACCENT2;ctx.font='700 14px ui-sans-serif,system-ui,sans-serif';
  ctx.fillText('EXTERNAL · CONTEXT SERVICE',rightX+36,220);
  ctx.fillStyle=TEXT;ctx.font='700 36px ui-sans-serif,system-ui,sans-serif';
  ctx.fillText('Dependencies',rightX+36,280);
  ctx.fillStyle=MUTED;ctx.font='500 22px ui-sans-serif,system-ui,sans-serif';
  ctx.fillText('What\'s in dependency X @ version Y?',rightX+36,320);

  const toolsR=['external_knowledge_context','external_code_search / read','external_code_callers / callees','external_index + status'];
  toolsR.forEach((t,i)=>{
    const appear=ease(clamp((p-0.28-i*0.06)/0.15));
    chip(rightX+36,380+i*90,760,64,t,ACCENT2,appear);
  });
  ctx.restore();

  // divider label
  if(p>0.75){
    const da=ease(clamp((p-0.75)/0.15));
    ctx.save();ctx.globalAlpha=da;
    ctx.fillStyle=MUTED;ctx.font='700 16px ui-monospace,Menlo,monospace';
    ctx.textAlign='center';
    ctx.fillText('do not mix selectors across planes',W/2,H-40);
    ctx.restore();
  }
  ctx.fillStyle='rgba(0,212,170,0.25)';ctx.fillRect(0,H-6,W*p,6);
};
window.__draw(0);
</script>
</body>
</html>
