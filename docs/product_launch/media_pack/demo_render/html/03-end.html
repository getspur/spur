<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<style>
  html,body{margin:0;width:1920px;height:1080px;background:#0B0E14;overflow:hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;}
  .wrap{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;text-align:center;}
  .kicker{color:#7FB4CA;font-size:24px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:20px;}
  h1{margin:0;color:#E6E1CF;font-size:52px;font-weight:650;letter-spacing:-.02em;}
  .cta{margin-top:40px;padding:18px 32px;border:1px solid #2a2e38;border-radius:10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;font-size:26px;color:#7FB4CA;background:#11141c;}
  .note{margin-top:28px;color:#8B8680;font-size:22px;}
</style></head>
<body>
  <div class="wrap">
    <div class="kicker">Install</div>
    <h1>Control tower for CLI coding agents.</h1>
    <div class="cta">curl -sSL getspur.dev/install.sh | sh</div>
    <div class="note">Community free. Real TUI proof.</div>
  </div>
</body></html>
