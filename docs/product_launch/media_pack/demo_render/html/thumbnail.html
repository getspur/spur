<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=512,height=512">
  <title>SPUR thumbnail</title>
  <style>
    :root{--bg:#0B0E14;--surface:#11141C;--text:#E6E1CF;--muted:#8B8680;--accent:#7FB4CA;--border:#2A2E38}
    *{box-sizing:border-box}html,body{margin:0;width:512px;height:512px;overflow:hidden;background:var(--bg);color:var(--text)}
    body{position:relative;padding:52px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
    .frame{position:absolute;inset:22px;border:1px solid var(--border)}
    .mark{position:absolute;top:52px;right:52px;width:44px;height:44px;border-top:4px solid var(--accent);border-right:4px solid var(--accent)}
    .word{position:absolute;left:52px;bottom:126px;margin:0;font-size:108px;line-height:.82;letter-spacing:-.075em;font-weight:800}
    .rule{position:absolute;left:52px;right:52px;bottom:92px;height:2px;background:var(--accent)}
    .tag{position:absolute;left:52px;right:74px;bottom:48px;margin:0;color:var(--muted);font:600 15px/1.25 "SFMono-Regular",Consolas,monospace;letter-spacing:.03em}
  </style>
</head>
<body>
  <div class="frame"></div>
  <div class="mark"></div>
  <p class="word">SPUR</p>
  <div class="rule"></div>
  <p class="tag">CONTROL TOWER FOR CLI CODING AGENTS.</p>
</body>
</html>
