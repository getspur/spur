<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<style>
  html,body{margin:0;width:1920px;height:1080px;background:#0B0E14;overflow:hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;}
  .wrap{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
    height:100%;padding:0 140px;box-sizing:border-box;}
  .kicker{color:#7FB4CA;font-size:28px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:28px;}
  h1{margin:0;color:#E6E1CF;font-size:72px;font-weight:650;letter-spacing:-.02em;line-height:1.1;max-width:16ch;}
  .sub{margin-top:28px;color:#8B8680;font-size:32px;max-width:28ch;}
  .bar{position:absolute;left:140px;bottom:120px;width:120px;height:4px;background:#957FB8;}
</style></head>
<body>
  <div class="wrap">
    <div class="kicker">SPUR</div>
    <h1>Control tower for CLI coding agents.</h1>
    <div class="sub">Real sessions. Visible worker state. Explicit plan state.</div>
  </div>
  <div class="bar"></div>
</body></html>
