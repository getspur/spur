[build]
# Force frame pointers for accurate stack unwinding during profiling.
# Required by perf (Linux) and greatly improves DTrace (macOS) output quality.
rustflags = ["-C", "force-frame-pointers=yes"]

# scripts/spur-cargo injects the sccache worktree wrapper for local Unix-like
# builds. Do not set rustc-wrapper here: cargo-dist and Windows CI inherit this
# file and cannot execute the shell wrapper.

[alias]
# One-step profiling build alias
spur-profile = "build --profile profiling"
# One-step flamegraph for the main spur binary
spur-flamegraph = "flamegraph --profile profiling --bin spur"
