<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPUR Context Service — Login preview</title>
  <!--
    Local design preview of Cognito Hosted UI with SPUR branding.
    Structure mirrors Cognito's mobile modal so cognito-login.css can be
    validated without a deploy. Production CSS is applied by Terraform
    (aws_cognito_user_pool_ui_customization).
  -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Minimal stand-in for cognito-login.css defaults (overridden by our file). -->
  <style>
    body { font-family: Arial, sans-serif; color: #3b3b3b; background: #909090; }
    .modal-content { width: 100% !important; margin: 0 auto; border: 0; overflow: hidden; border-radius: 0; }
    .modal-content-mobile { max-width: 350px; }
    .logo-customizable { max-width: 60%; max-height: 30%; }
    .banner-customizable { padding: 25px 0; background-color: lightgray; }
    .label-customizable { font-weight: 400; }
    .textDescription-customizable, .idpDescription-customizable {
      padding-top: 10px; padding-bottom: 10px; display: block; font-size: 16px;
    }
    .legalText-customizable { color: #747474; font-size: 11px; }
    .submitButton-customizable {
      font-size: 14px; font-weight: bold; margin: 20px 0 10px; height: 40px; width: 100%;
      color: #fff; background-color: #337ab7; border-color: #2e6da4;
    }
    .inputField-customizable {
      width: 100%; height: 34px; color: #555; background-color: #fff; border: 1px solid #ccc;
    }
    .socialButton-customizable {
      border-radius: 2px; height: 40px; margin-bottom: 15px; padding: 1px; text-align: left; width: 100%;
    }
    .socialButton-customizable.google-button { background: #4285f4; color: #fff; border: none; }
    .socialButton-customizable .social-logo { width: 32px; height: 32px; display: inline-block; vertical-align: middle; margin-right: 8px; }
    .login-or { position: relative; font-size: 16px; padding: 7px 0; margin-top: 8px; }
    .hr-or { color: #cdcdcd; background-color: #cdcdcd; height: 1px; margin: 0 !important; }
    .span-or {
      display: block; position: absolute; left: 50%; top: -2px; margin-left: -25px;
      background-color: #fff; text-align: center; padding: 0 5px; color: #a3a3a3;
    }
    .background-customizable { background-color: #fff; }
    .redirect-customizable { color: #337ab7; }
    .preview-meta {
      position: fixed; top: 16px; left: 16px; z-index: 20;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      color: #8b949e; background: rgba(14, 17, 22, 0.85);
      border: 1px solid #2d333b; border-radius: 6px; padding: 8px 12px;
    }
    .preview-meta strong { color: #ffb454; font-weight: 600; }
  </style>
  <link rel="stylesheet" href="./cognito-login.css" />
</head>
<body spellcheck="false">
  <div class="preview-meta">
    SPUR Hosted UI preview · <strong>context service</strong>
  </div>
  <div class="container">
    <div class="modal-dialog">
      <div class="modal-content background-customizable modal-content-mobile">
        <div>
          <div class="banner-customizable">
            <center>
              <img
                class="logo-customizable"
                src="./logo.svg"
                width="180"
                height="40"
                alt="SPUR"
              />
            </center>
          </div>
        </div>
        <div class="modal-body">
          <div>
            <span class="idpDescription-customizable">Sign in with your social account</span>
            <button type="button" class="btn google-button socialButton-customizable" name="googleSignUpButton">
              <span>
                <svg class="social-logo" viewBox="0 0 256 262" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid" aria-hidden="true">
                  <path d="M255.878 133.451c0-10.734-.871-18.567-2.756-26.69H130.55v48.448h71.947c-1.45 12.04-9.283 30.172-26.69 42.356l-.244 1.622 38.755 30.023 2.685.268c24.659-22.774 38.875-56.282 38.875-96.027" fill="#4285F4"/>
                  <path d="M130.55 261.1c35.248 0 64.839-11.605 86.453-31.622l-41.196-31.913c-11.024 7.688-25.82 13.055-45.257 13.055-34.523 0-63.824-22.773-74.269-54.25l-1.531.13-40.298 31.187-.527 1.465C35.393 231.798 79.49 261.1 130.55 261.1" fill="#34A853"/>
                  <path d="M56.281 156.37c-2.756-8.123-4.351-16.827-4.351-25.82 0-8.994 1.595-17.697 4.206-25.82l-.073-1.73L15.26 71.312l-1.335.635C5.077 89.644 0 109.517 0 130.55s5.077 40.905 13.925 58.602l42.356-32.782" fill="#FBBC05"/>
                  <path d="M130.55 50.479c24.514 0 41.05 10.589 50.479 19.438l36.844-35.974C195.245 12.91 165.798 0 130.55 0 79.49 0 35.393 29.301 13.925 71.947l42.211 32.783c10.59-31.477 39.891-54.251 74.414-54.251" fill="#EA4335"/>
                </svg>
              </span>
              <span>Continue with Google</span>
            </button>
            <br />
            <span class="legalText-customizable">We won't post to any of your accounts without asking first</span>
          </div>

          <div class="login-or">
            <hr class="hr-or" />
            <span class="span-or background-customizable">or</span>
          </div>

          <div>
            <span class="textDescription-customizable">Sign in with your email and password</span>
            <form class="cognito-asf" onsubmit="return false;">
              <label for="signInFormUsername" class="label-customizable">Email</label>
              <div>
                <input
                  id="signInFormUsername"
                  name="username"
                  type="text"
                  class="form-control inputField-customizable"
                  placeholder="name@host.com"
                  autocapitalize="none"
                  required
                />
              </div>

              <label for="signInFormPassword" class="label-customizable">Password</label>
              <div>
                <input
                  id="signInFormPassword"
                  name="password"
                  type="password"
                  class="form-control inputField-customizable"
                  placeholder="Password"
                  required
                />
              </div>

              <div>
                <a class="redirect-customizable" href="#forgot">Forgot your password?</a>
              </div>

              <input
                name="signInSubmitButton"
                type="submit"
                value="Sign in"
                class="btn btn-primary submitButton-customizable"
                aria-label="Sign in"
              />
              <br />
              <div>
                <p class="redirect-customizable">
                  <span>Need an account?</span>&nbsp;<a href="#signup">Sign up</a>
                </p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
