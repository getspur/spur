# cargo-dist configuration for Spur
# Docs: https://axodotdev.github.io/cargo-dist/book/reference/config.html
#
# This file drives `cargo dist` — it generates:
#   - .github/workflows/release.yml (cross-compile matrix + artifact upload)
#   - npm installer package that `npx spur` resolves
#
# Run `cargo dist init` after editing to regenerate the GitHub Actions workflow.

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# Target platforms to build apps for (Rust target-triple syntax).
# Temporarily omit x86_64-unknown-linux-musl and x86_64-pc-windows-msvc;
# the v1.0.1 release showed target-specific build failures that need debug.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm"]
# Generate and dist a source tarball
source-tarball = false
# A namespace to use when publishing this package to the npm registry
npm-scope = "@getspur"
# Host release artifacts on a separate public repo (source stays private)
github-releases-repo = "getspur/spur-releases"
# Whether to produce an npm lockfile
npm-shrinkwrap = true
# Publish jobs to run in CI
publish-jobs = ["npm"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# release.yml carries intentional manual env injection for LicenseSeat builds.
allow-dirty = ["ci"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"

# GitHub Actions removed ubuntu-22.04 from the hosted runner pool on
# 2026-05-22; jobs that requested it sat in "waiting for a hosted runner"
# until they timed out 3 seconds later with no step logs. Pin Linux jobs
# to ubuntu-24.04 (which the matrix-driven build-local-artifacts jobs
# also inherit via dist plan output).
[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-24.04"

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-24.04-arm"
# Whether to install an updater program
install-updater = false

# ---- Per-crate: only spur-cli produces a distributable binary ----
# cargo-dist auto-detects binary crates, but we set explicit metadata in
# crates/spur-cli/Cargo.toml to be sure:
#
#   [package.metadata.dist]
#   dist = true
#
# And in every library crate (spur-acp, spur-core, spur-mcp, spur-pm,
# spur-worktree, spur-cost, spur-tui):
#
#   [package.metadata.dist]
#   dist = false
