[workspace]
resolver = "2"
members = [
    "crates/spur-acp",
    "crates/spur-blob-store",
    "crates/spur-mcp",
    "crates/spur-core",
    "crates/spur-pm",
    "crates/spur-worktree",
    "crates/spur-cost",
    "crates/spur-license",
    "crates/spur-license-admin",
    "crates/spur-tui",
    "crates/spur-interactive",
    "crates/spur-bot",
    "crates/spur-cli",
    "crates/spur-context",
]
# vendor/ holds the fsqlite-* crates patched in via [patch.crates-io] below.
# Excluded from this workspace; vendor/Cargo.toml is its own workspace root.
exclude = ["vendor"]

[workspace.package]
version = "1.1.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
schemars = "0.8"
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
async-trait = "0.1"
futures = "0.3"
pin-project-lite = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"
pulldown-cmark = { version = "0.13", default-features = false }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
rmcp = { version = "1.4", features = [
    "client",
    "server",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
# `bundled` makes duckdb-rs compile libduckdb from source and link it
# statically. This drops the runtime `libduckdb.dylib` dependency and lets
# `cargo install --path crates/spur-cli` work without any system package.
# Cost: a cold release build of duckdb ~4 minutes on macOS.
duckdb = { version = "1.10502.0", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
directories = "5"
regex = "1"
sha2 = "0.10"
proptest = "1"
petgraph = { version = "0.6", default-features = false, features = ["stable_graph"] }

# ACP SDK
agent-client-protocol = { version = "0.11", features = ["unstable_session_usage", "unstable_session_model"] }
licenseseat = "=0.5.3"

# Workspace crates
spur-acp = { path = "crates/spur-acp" }
spur-blob-store = { path = "crates/spur-blob-store" }
spur-mcp = { path = "crates/spur-mcp" }
spur-core = { path = "crates/spur-core" }
spur-pm = { path = "crates/spur-pm" }
spur-worktree = { path = "crates/spur-worktree" }
spur-cost = { path = "crates/spur-cost" }
spur-license = { path = "crates/spur-license" }
spur-tui = { path = "crates/spur-tui" }
spur-interactive = { path = "crates/spur-interactive" }
spur-bot = { path = "crates/spur-bot" }
spur-context = { path = "crates/spur-context" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Profiling profile: release optimizations with full debug symbols
# Use with: cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = true
strip = false
codegen-units = 1
lto = "thin"

# Override fsqlite-* crates with a snapshot of upstream master
# (https://github.com/Dicklesworthstone/frankensqlite @ f45d94e2, May 8 2026).
# Upstream master has Bug A fixed (reserved-bytes usable_size; engine.rs:419
# uses page_size.usable(reserved_per_page)) plus 200+ post-0.1.2 commits.
# Bug B (allocator page-ownership aliasing causing "2nd reference to page"
# corruption on writes) is NOT yet fixed upstream — tracked separately.
#
# Master declares version 0.1.3; we rewrite to 0.1.2 in vendor/*/Cargo.toml so
# cargo's patch mechanism accepts the override against beads_rust's 0.1.2 deps.
# Remove these entries when fsqlite 0.1.3 publishes to crates.io.
[patch.crates-io]
fsqlite               = { path = "vendor/fsqlite" }
fsqlite-ast           = { path = "vendor/fsqlite-ast" }
fsqlite-btree         = { path = "vendor/fsqlite-btree" }
fsqlite-core          = { path = "vendor/fsqlite-core" }
fsqlite-error         = { path = "vendor/fsqlite-error" }
fsqlite-ext-fts5      = { path = "vendor/fsqlite-ext-fts5" }
fsqlite-ext-icu       = { path = "vendor/fsqlite-ext-icu" }
fsqlite-ext-json      = { path = "vendor/fsqlite-ext-json" }
fsqlite-ext-misc      = { path = "vendor/fsqlite-ext-misc" }
fsqlite-ext-rtree     = { path = "vendor/fsqlite-ext-rtree" }
fsqlite-func          = { path = "vendor/fsqlite-func" }
fsqlite-mvcc          = { path = "vendor/fsqlite-mvcc" }
fsqlite-observability = { path = "vendor/fsqlite-observability" }
fsqlite-pager         = { path = "vendor/fsqlite-pager" }
fsqlite-parser        = { path = "vendor/fsqlite-parser" }
fsqlite-planner       = { path = "vendor/fsqlite-planner" }
fsqlite-types         = { path = "vendor/fsqlite-types" }
fsqlite-vdbe          = { path = "vendor/fsqlite-vdbe" }
fsqlite-vfs           = { path = "vendor/fsqlite-vfs" }
fsqlite-wal           = { path = "vendor/fsqlite-wal" }
