# Build & publish Spur as platform wheels to PyPI → consumed by `uvx spur`.
#
# Companion to the cargo-dist-generated .github/workflows/release.yml (which
# handles GitHub Releases + npm). Both trigger on the same tag push.
#
# Auth model: PyPI Trusted Publishing (OIDC). No long-lived token.
# One-time setup on PyPI:
#   1. Publish the first release manually: `maturin publish` with a token, OR
#      claim the `spur` name via PyPI's "pending publisher" page:
#      https://pypi.org/manage/account/publishing/
#   2. Register this workflow as a trusted publisher:
#        Owner:          yourorg
#        Repository:     spur
#        Workflow name:  release-python.yml
#        Environment:    pypi
#
# Docs: https://docs.pypi.org/trusted-publishers/

name: release-python

on:
  push:
    tags: ["v*"]
  # Allow manual runs against a branch for testing (won't publish unless env gate passes).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: "2_17"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            # aws-lc/ring need a newer aarch64 cross toolchain than
            # manylinux_2_17 provides.
            manylinux: "2_28"
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            manylinux: "musllinux_1_2"
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          command: build
          args: --release --out dist
          working-directory: python
          # maturin-action will install `cross` automatically for non-native
          # Linux targets (e.g. aarch64-unknown-linux-gnu from ubuntu-latest),
          # which is what handles rusqlite's bundled SQLite C compilation.
          sccache: "true"

      # Fail CI if the wheel links non-system shared libraries (e.g. chafa, glib).
      # Standard glibc/libgcc refs are expected and fine for manylinux wheels.
      - name: Reject external dylibs
        if: runner.os == 'Linux'
        run: |
          pip install auditwheel
          for whl in python/dist/*.whl; do
            auditwheel show "$whl" 2>&1 | tee /tmp/aw.txt
            if grep -qE "would need to be bundled|not-a-platform-wheel" /tmp/aw.txt; then
              echo "::error::Wheel has non-system shared library dependencies"
              cat /tmp/aw.txt
              exit 1
            fi
            echo "✅ $(basename $whl) is clean"
          done

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only publish on a real tag push, not workflow_dispatch.
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/spur-cli/
    permissions:
      id-token: write   # required for Trusted Publishing OIDC
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
