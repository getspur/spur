a_record_data = { json = "$.a_record.data", type = "Utf8" }
a_record_host = { json = "$.a_record.host", type = "Utf8" }
a_record_type = { json = "$.a_record.type", type = "Utf8" }
a_record_valid = { json = "$.a_record.valid", type = "Boolean" }
domain = { json = "$.domain", type = "Utf8" }
id = { json = "$.id", type = "Int64" }
ip = { json = "$.ip", type = "Utf8" }
last_validation_attempt_at = { json = "$.last_validation_attempt_at", type = "Int64" }
legacy = { json = "$.legacy", type = "Boolean" }
rdns = { json = "$.rdns", type = "Utf8" }
subdomain = { json = "$.subdomain", type = "Utf8" }
users = { json = "$.users", type = "Utf8" }
valid = { json = "$.valid", type = "Boolean" }

[table.filters]
ip = { param = "ip" }

[[table]]
name = "getreversedns"
path = "/v3/whitelabel/ips/{id}"
response_path = "$.users"

[table.columns]
user_id = { json = "$.user_id", type = "Int64" }
username = { json = "$.username", type = "Utf8" }

