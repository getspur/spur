[source]
name = "linear"
base_url = "https://api.linear.app/graphql"
transport = "graphql"
allow_writes = true
auth = { scheme = "header", name = "authorization", env = "LINEAR_API_KEY" }

[source.pagination]
style = "cursor"
page_size = 50
cursor_param = "after"
cursor_path = "$.data.issues.pageInfo.endCursor"
has_next_path = "$.data.issues.pageInfo.hasNextPage"

[[table]]
name = "issues"
path = "/graphql"
response_path = "$.data.issues.nodes"
filters = { state = { param = "stateFilter" } }

[table.graphql]
query = "query Issues($first:Int!, $after:String, $stateFilter:String){ issues(first:$first, after:$after, filter:{state:{name:{eq:$stateFilter}}}){ nodes{ id identifier title priority state{name} assignee{name} createdAt } pageInfo{ hasNextPage endCursor } } }"
arg_vars = { state = "stateFilter" }

[table.columns]
id = { json = "$.id", type = "Utf8" }
identifier = { json = "$.identifier", type = "Utf8" }
title = { json = "$.title", type = "Utf8" }
priority = { json = "$.priority", type = "Int64" }
state = { json = "$.state.name", type = "Utf8" }
assignee = { json = "$.assignee.name", type = "Utf8" }
created_at = { json = "$.createdAt", type = "Utf8" }

[[table]]
name = "projects"
path = "/graphql"
response_path = "$.data.projects.nodes"

[table.graphql]
query = "query Projects{ projects(first:250){ nodes{ id name description slugId url priority createdAt updatedAt status{name type} lead{name} } pageInfo{ hasNextPage endCursor } } }"

[table.columns]
id = { json = "$.id", type = "Utf8" }
name = { json = "$.name", type = "Utf8" }
description = { json = "$.description", type = "Utf8" }
slug_id = { json = "$.slugId", type = "Utf8" }
url = { json = "$.url", type = "Utf8" }
priority = { json = "$.priority", type = "Int64" }
created_at = { json = "$.createdAt", type = "Utf8" }
updated_at = { json = "$.updatedAt", type = "Utf8" }
status = { json = "$.status.name", type = "Utf8" }
status_type = { json = "$.status.type", type = "Utf8" }
lead = { json = "$.lead.name", type = "Utf8" }

[[table]]
name = "teams"
path = "/graphql"
response_path = "$.data.teams.nodes"

[table.graphql]
query = "query Teams{ teams(first:250){ nodes{ id key name description timezone cyclesEnabled createdAt updatedAt } pageInfo{ hasNextPage endCursor } } }"

[table.columns]
id = { json = "$.id", type = "Utf8" }
key = { json = "$.key", type = "Utf8" }
name = { json = "$.name", type = "Utf8" }
description = { json = "$.description", type = "Utf8" }
timezone = { json = "$.timezone", type = "Utf8" }
cycles_enabled = { json = "$.cyclesEnabled", type = "Boolean" }
created_at = { json = "$.createdAt", type = "Utf8" }
updated_at = { json = "$.updatedAt", type = "Utf8" }

[[table]]
name = "users"
path = "/graphql"
response_path = "$.data.users.nodes"

[table.graphql]
query = "query Users{ users(first:250){ nodes{ id name displayName email active admin guest createdAt updatedAt } pageInfo{ hasNextPage endCursor } } }"

[table.columns]
id = { json = "$.id", type = "Utf8" }
name = { json = "$.name", type = "Utf8" }
display_name = { json = "$.displayName", type = "Utf8" }
email = { json = "$.email", type = "Utf8" }
active = { json = "$.active", type = "Boolean" }
admin = { json = "$.admin", type = "Boolean" }
guest = { json = "$.guest", type = "Boolean" }
created_at = { json = "$.createdAt", type = "Utf8" }
updated_at = { json = "$.updatedAt", type = "Utf8" }

[[table]]
name = "cycles"
path = "/graphql"
response_path = "$.data.cycles.nodes"

[table.graphql]
query = "query Cycles{ cycles(first:250){ nodes{ id number name startsAt endsAt completedAt createdAt updatedAt team{key name} } pageInfo{ hasNextPage endCursor } } }"

[table.columns]
id = { json = "$.id", type = "Utf8" }
number = { json = "$.number", type = "Int64" }
name = { json = "$.name", type = "Utf8" }
starts_at = { json = "$.startsAt", type = "Utf8" }
ends_at = { json = "$.endsAt", type = "Utf8" }
completed_at = { json = "$.completedAt", type = "Utf8" }
created_at = { json = "$.createdAt", type = "Utf8" }
updated_at = { json = "$.updatedAt", type = "Utf8" }
team_key = { json = "$.team.key", type = "Utf8" }
team_name = { json = "$.team.name", type = "Utf8" }

[[table]]
name = "issue_labels"
path = "/graphql"
response_path = "$.data.issueLabels.nodes"

[table.graphql]
query = "query IssueLabels{ issueLabels(first:250){ nodes{ id name description color createdAt updatedAt team{key name} parent{name} } pageInfo{ hasNextPage endCursor } } }"

[table.columns]
id = { json = "$.id", type = "Utf8" }
name = { json = "$.name", type = "Utf8" }
description = { json = "$.description", type = "Utf8" }
color = { json = "$.color", type = "Utf8" }
created_at = { json = "$.createdAt", type = "Utf8" }
updated_at = { json = "$.updatedAt", type = "Utf8" }
team_key = { json = "$.team.key", type = "Utf8" }
team_name = { json = "$.team.name", type = "Utf8" }
parent = { json = "$.parent.name", type = "Utf8" }

[[table]]
name = "workflow_states"
path = "/graphql"
response_path = "$.data.workflowStates.nodes"

[table.graphql]
query = "query WorkflowStates{ workflowStates(first:250){ nodes{ id name description color type position createdAt updatedAt team{key name} } pageInfo{ hasNextPage endCursor } } }"

[table.columns]
id = { json = "$.id", type = "Utf8" }
name = { json = "$.name", type = "Utf8" }
description = { json = "$.description", type = "Utf8" }
color = { json = "$.color", type = "Utf8" }
type = { json = "$.type", type = "Utf8" }
position = { json = "$.position", type = "Float64" }
created_at = { json = "$.createdAt", type = "Utf8" }
updated_at = { json = "$.updatedAt", type = "Utf8" }
team_key = { json = "$.team.key", type = "Utf8" }
team_name = { json = "$.team.name", type = "Utf8" }

[[table]]
name = "comments"
path = "/graphql"
response_path = "$.data.comments.nodes"

[table.graphql]
query = "query Comments{ comments(first:250){ nodes{ id body createdAt updatedAt user{name} issue{identifier title} } pageInfo{ hasNextPage endCursor } } }"

[table.columns]
id = { json = "$.id", type = "Utf8" }
body = { json = "$.body", type = "Utf8" }
created_at = { json = "$.createdAt", type = "Utf8" }
updated_at = { json = "$.updatedAt", type = "Utf8" }
user = { json = "$.user.name", type = "Utf8" }
issue_identifier = { json = "$.issue.identifier", type = "Utf8" }
issue_title = { json = "$.issue.title", type = "Utf8" }

[[table]]
name = "organization"
path = "/graphql"
response_path = "$.data.organization"

[table.graphql]
query = "query Organization{ organization{ id name urlKey createdAt updatedAt } }"

[table.columns]
id = { json = "$.id", type = "Utf8" }
name = { json = "$.name", type = "Utf8" }
url_key = { json = "$.urlKey", type = "Utf8" }
created_at = { json = "$.createdAt", type = "Utf8" }
updated_at = { json = "$.updatedAt", type = "Utf8" }

[[action]]
name = "create_issue"
method = "POST"
path = "/graphql"
response_path = "$.data.issueCreate.issue"

[action.graphql]
query = "mutation CreateIssue($title:String!, $teamId:String!, $description:String){ issueCreate(input:{title:$title, teamId:$teamId, description:$description}){ issue{ id identifier url } } }"
arg_vars = { title = "title", teamId = "teamId", description = "description" }

[action.args]
title = { in = "body", type = "Utf8", required = true }
teamId = { in = "body", type = "Utf8", required = true }
description = { in = "body", type = "Utf8" }

[action.columns]
id = { json = "$.id", type = "Utf8" }
identifier = { json = "$.identifier", type = "Utf8" }
url = { json = "$.url", type = "Utf8" }

[[action]]
name = "update_issue"
method = "POST"
path = "/graphql"
response_path = "$.data.issueUpdate.issue"

[action.graphql]
query = "mutation UpdateIssue($id:String!, $title:String, $stateId:String){ issueUpdate(id:$id, input:{title:$title, stateId:$stateId}){ issue{ id } } }"
arg_vars = { id = "id", title = "title", stateId = "stateId" }

[action.args]
id = { in = "body", type = "Utf8", required = true }
title = { in = "body", type = "Utf8" }
stateId = { in = "body", type = "Utf8" }

[action.columns]
id = { json = "$.id", type = "Utf8" }

[[action]]
name = "create_comment"
method = "POST"
path = "/graphql"
response_path = "$.data.commentCreate.comment"

[action.graphql]
query = "mutation CreateComment($issueId:String!, $body:String!){ commentCreate(input:{issueId:$issueId, body:$body}){ comment{ id } } }"
arg_vars = { issueId = "issueId", body = "body" }

[action.args]
issueId = { in = "body", type = "Utf8", required = true }
body = { in = "body", type = "Utf8", required = true }

[action.columns]
id = { json = "$.id", type = "Utf8" }

[[action]]
name = "create_project"
method = "POST"
path = "/graphql"
response_path = "$.data.projectCreate.project"

[action.graphql]
query = "mutation CreateProject($name:String!, $teamIds:[String!]!){ projectCreate(input:{name:$name, teamIds:$teamIds}){ project{ id name } } }"
arg_vars = { name = "name", teamIds = "teamIds" }

[action.args]
name = { in = "body", type = "Utf8", required = true }
teamIds = { in = "body", type = "Utf8", required = true }

[action.columns]
id = { json = "$.id", type = "Utf8" }
name = { json = "$.name", type = "Utf8" }
