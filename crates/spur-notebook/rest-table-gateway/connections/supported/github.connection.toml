# Curated GitHub REST manifest for the REST table gateway.
# Source grounding: Nango github-pat auth metadata + GitHub REST OpenAPI table shapes.

[source]
name = "github"
base_url = "https://api.github.com"
allow_writes = true
auth = { scheme = "bearer", env = "GITHUB_TOKEN" }

[source.pagination]
style = "link"
link_rel = "next"

[source.headers]
x-github-api-version = "2022-11-28"

[[table]]
name = "security_advisories"
path = "/advisories"

[table.columns]
ghsa_id = { json = "$.ghsa_id", type = "Utf8" }
cve_id = { json = "$.cve_id", type = "Utf8" }
summary = { json = "$.summary", type = "Utf8" }
severity = { json = "$.severity", type = "Utf8" }
published_at = { json = "$.published_at", type = "Utf8" }
updated_at = { json = "$.updated_at", type = "Utf8" }

[table.filters]
ecosystem = { param = "ecosystem" }
severity = { param = "severity" }
type = { param = "type" }

[[table]]
name = "authenticated_repos"
path = "/user/repos"

[table.columns]
id = { json = "$.id", type = "Int64" }
name = { json = "$.name", type = "Utf8" }
full_name = { json = "$.full_name", type = "Utf8" }
private = { json = "$.private", type = "Boolean" }
html_url = { json = "$.html_url", type = "Utf8" }
default_branch = { json = "$.default_branch", type = "Utf8" }
updated_at = { json = "$.updated_at", type = "Utf8" }

[table.filters]
visibility = { param = "visibility" }
affiliation = { param = "affiliation" }
sort = { param = "sort" }
direction = { param = "direction" }

[[table]]
name = "user_issues"
path = "/issues"

[table.columns]
id = { json = "$.id", type = "Int64" }
number = { json = "$.number", type = "Int64" }
title = { json = "$.title", type = "Utf8" }
state = { json = "$.state", type = "Utf8" }
html_url = { json = "$.html_url", type = "Utf8" }
created_at = { json = "$.created_at", type = "Utf8" }
updated_at = { json = "$.updated_at", type = "Utf8" }
repository_full_name = { json = "$.repository.full_name", type = "Utf8" }
user_login = { json = "$.user.login", type = "Utf8" }
comments = { json = "$.comments", type = "Int64" }

[table.filters]
filter = { param = "filter" }
state = { param = "state" }
labels = { param = "labels" }
sort = { param = "sort" }
direction = { param = "direction" }
since = { param = "since" }

[[table]]
name = "user_orgs"
path = "/user/orgs"

[table.columns]
id = { json = "$.id", type = "Int64" }
login = { json = "$.login", type = "Utf8" }
description = { json = "$.description", type = "Utf8" }
url = { json = "$.url", type = "Utf8" }
avatar_url = { json = "$.avatar_url", type = "Utf8" }

[[table]]
name = "user_gists"
path = "/gists"

[table.columns]
id = { json = "$.id", type = "Utf8" }
description = { json = "$.description", type = "Utf8" }
public = { json = "$.public", type = "Boolean" }
html_url = { json = "$.html_url", type = "Utf8" }
created_at = { json = "$.created_at", type = "Utf8" }
updated_at = { json = "$.updated_at", type = "Utf8" }
owner_login = { json = "$.owner.login", type = "Utf8" }
comments = { json = "$.comments", type = "Int64" }

[table.filters]
since = { param = "since" }

[[table]]
name = "starred"
path = "/user/starred"

[table.columns]
id = { json = "$.id", type = "Int64" }
name = { json = "$.name", type = "Utf8" }
full_name = { json = "$.full_name", type = "Utf8" }
private = { json = "$.private", type = "Boolean" }
html_url = { json = "$.html_url", type = "Utf8" }
description = { json = "$.description", type = "Utf8" }
language = { json = "$.language", type = "Utf8" }
stargazers_count = { json = "$.stargazers_count", type = "Int64" }
updated_at = { json = "$.updated_at", type = "Utf8" }
owner_login = { json = "$.owner.login", type = "Utf8" }

[table.filters]
sort = { param = "sort" }
direction = { param = "direction" }

[[table]]
name = "notifications"
path = "/notifications"

[table.columns]
id = { json = "$.id", type = "Utf8" }
reason = { json = "$.reason", type = "Utf8" }
unread = { json = "$.unread", type = "Boolean" }
updated_at = { json = "$.updated_at", type = "Utf8" }
last_read_at = { json = "$.last_read_at", type = "Utf8" }
subject_title = { json = "$.subject.title", type = "Utf8" }
subject_type = { json = "$.subject.type", type = "Utf8" }
subject_url = { json = "$.subject.url", type = "Utf8" }
repository_full_name = { json = "$.repository.full_name", type = "Utf8" }

[table.filters]
all = { param = "all" }
participating = { param = "participating" }
since = { param = "since" }
before = { param = "before" }

[[table]]
name = "user_followers"
path = "/user/followers"

[table.columns]
id = { json = "$.id", type = "Int64" }
login = { json = "$.login", type = "Utf8" }
type = { json = "$.type", type = "Utf8" }
site_admin = { json = "$.site_admin", type = "Boolean" }
html_url = { json = "$.html_url", type = "Utf8" }
avatar_url = { json = "$.avatar_url", type = "Utf8" }

[[table]]
name = "user_emails"
path = "/user/emails"

[table.columns]
email = { json = "$.email", type = "Utf8" }
primary = { json = "$.primary", type = "Boolean" }
verified = { json = "$.verified", type = "Boolean" }
visibility = { json = "$.visibility", type = "Utf8" }

[[table]]
name = "search_issues"
path = "/search/issues"
response_path = "$.items"

[table.columns]
id = { json = "$.id", type = "Int64" }
number = { json = "$.number", type = "Int64" }
title = { json = "$.title", type = "Utf8" }
state = { json = "$.state", type = "Utf8" }
html_url = { json = "$.html_url", type = "Utf8" }
created_at = { json = "$.created_at", type = "Utf8" }
updated_at = { json = "$.updated_at", type = "Utf8" }
repository_full_name = { json = "$.repository.full_name", type = "Utf8" }
user_login = { json = "$.user.login", type = "Utf8" }
comments = { json = "$.comments", type = "Int64" }

[table.filters]
q = { param = "q" }
sort = { param = "sort" }
order = { param = "order" }

[[action]]
name = "create_issue"
method = "POST"
path = "/repos/{owner}/{repo}/issues"

[action.args]
owner = { in = "path", type = "Utf8", required = true }
repo = { in = "path", type = "Utf8", required = true }
title = { in = "body", type = "Utf8", required = true }
body = { in = "body", type = "Utf8" }
labels = { in = "body", type = "Utf8" }

[action.columns]
number = { json = "$.number", type = "Int64" }
html_url = { json = "$.html_url", type = "Utf8" }
state = { json = "$.state", type = "Utf8" }

[[action]]
name = "add_issue_comment"
method = "POST"
path = "/repos/{owner}/{repo}/issues/{issue_number}/comments"

[action.args]
owner = { in = "path", type = "Utf8", required = true }
repo = { in = "path", type = "Utf8", required = true }
issue_number = { in = "path", type = "Int64", required = true }
body = { in = "body", type = "Utf8", required = true }

[action.columns]
id = { json = "$.id", type = "Int64" }
html_url = { json = "$.html_url", type = "Utf8" }

[[action]]
name = "update_issue"
method = "PATCH"
path = "/repos/{owner}/{repo}/issues/{issue_number}"

[action.args]
owner = { in = "path", type = "Utf8", required = true }
repo = { in = "path", type = "Utf8", required = true }
issue_number = { in = "path", type = "Int64", required = true }
title = { in = "body", type = "Utf8" }
body = { in = "body", type = "Utf8" }
state = { in = "body", type = "Utf8" }

[action.columns]
number = { json = "$.number", type = "Int64" }
state = { json = "$.state", type = "Utf8" }

[[action]]
name = "create_pull_request"
method = "POST"
path = "/repos/{owner}/{repo}/pulls"

[action.args]
