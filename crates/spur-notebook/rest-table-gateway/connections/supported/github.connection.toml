repo = { in = "path", type = "Utf8", required = true }
title = { in = "body", type = "Utf8", required = true }
head = { in = "body", type = "Utf8", required = true }
base = { in = "body", type = "Utf8", required = true }
body = { in = "body", type = "Utf8" }

[action.columns]
number = { json = "$.number", type = "Int64" }
html_url = { json = "$.html_url", type = "Utf8" }

[[action]]
name = "create_release"
method = "POST"
path = "/repos/{owner}/{repo}/releases"

[action.args]
owner = { in = "path", type = "Utf8", required = true }
repo = { in = "path", type = "Utf8", required = true }
tag_name = { in = "body", type = "Utf8", required = true }
name = { in = "body", type = "Utf8" }
