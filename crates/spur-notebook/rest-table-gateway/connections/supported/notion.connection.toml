# Curated Notion REST manifest for the REST table gateway.
# Source grounding: Nango notion OAuth2 metadata + Notion OpenAPI comments table shape.
# Auth is explicit BYO access token; hosted OAuth browser flow is intentionally out of scope.

[source]
name = "notion"
base_url = "https://api.notion.com"
auth = { scheme = "bearer", env = "NOTION_ACCESS_TOKEN" }

[source.headers]
notion-version = "2022-06-28"

[[table]]
name = "comments"
path = "/v1/comments"
response_path = "$.results"

[table.columns]
id = { json = "$.id", type = "Utf8" }
object = { json = "$.object", type = "Utf8" }
discussion_id = { json = "$.discussion_id", type = "Utf8" }
created_time = { json = "$.created_time", type = "Utf8" }
last_edited_time = { json = "$.last_edited_time", type = "Utf8" }
created_by_id = { json = "$.created_by.id", type = "Utf8" }

[table.filters]
block_id = { param = "block_id" }
page_size = { param = "page_size" }
