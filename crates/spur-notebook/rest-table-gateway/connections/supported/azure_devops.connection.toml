# Reviewed Azure DevOps Services manifest for the REST table gateway.
# Source grounding: Nango azure-devops auth metadata + credentials verification hook.

[source]
name = "azure_devops"
base_url = "https://${connectionConfig.organizationUrl}"
auth = { scheme = "basic", user_env = "AZURE_DEVOPS_USER", pass_env = "AZURE_DEVOPS_PAT" }
connection_config = ["organizationUrl"]

[[table]]
name = "projects"
path = "/_apis/projects"
response_path = "$.value"

[table.columns]
id = { json = "$.id", type = "Utf8" }
name = { json = "$.name", type = "Utf8" }
url = { json = "$.url", type = "Utf8" }
state = { json = "$.state", type = "Utf8" }
