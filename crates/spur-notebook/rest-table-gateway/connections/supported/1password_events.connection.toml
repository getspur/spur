# Reviewed 1Password Events manifest for the REST table gateway.
# Source grounding: Nango 1password-events auth metadata + APIs.guru 1password.com:events spec.

[source]
name = "1password_events"
base_url = "https://${connectionConfig.domain}"
auth = { scheme = "bearer", env = "ONEPASSWORD_EVENTS_TOKEN" }
connection_config = ["domain"]

[[table]]
name = "auth_introspection"
path = "/api/v2/auth/introspect"
response_path = "$.Features"

[table.columns]
feature = { json = "$", type = "Utf8" }
