# Curated Autotask REST manifest for the REST table gateway.
# Source grounding: Nango autotask API-key metadata + Autotask Companies query table shape.
# This is the simple-auth substitute for Trello, whose OAuth1 signing is not representable today.

[source]
name = "autotask"
base_url = "https://${connectionConfig.subdomain}.autotask.net/atservicesrest"
connection_config = ["subdomain", "apiIntegrationCode", "username"]
auth = { scheme = "header", name = "secret", env = "AUTOTASK_API_SECRET" }

[source.headers]
apiintegrationcode = "${connectionConfig.apiIntegrationCode}"
username = "${connectionConfig.username}"

[[table]]
name = "companies"
path = "/V1.0/Companies/query"
response_path = "$.items"

[table.columns]
id = { json = "$.id", type = "Int64" }
company_name = { json = "$.companyName", type = "Utf8" }
company_number = { json = "$.companyNumber", type = "Utf8" }
is_active = { json = "$.isActive", type = "Boolean" }
web_address = { json = "$.webAddress", type = "Utf8" }

[table.filters]
search = { param = "search" }
