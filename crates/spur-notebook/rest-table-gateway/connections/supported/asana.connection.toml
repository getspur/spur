# Curated Asana REST manifest for the REST table gateway.
# Source grounding: Nango asana OAuth2 metadata + Asana OpenAPI workspace table shape.
# Auth is explicit BYO access token; hosted OAuth browser flow is intentionally out of scope.

[source]
name = "asana"
base_url = "https://app.asana.com/api/1.0"
auth = { scheme = "bearer", env = "ASANA_ACCESS_TOKEN" }

[[table]]
name = "workspaces"
path = "/workspaces"
response_path = "$.data"

[table.columns]
gid = { json = "$.gid", type = "Utf8" }
resource_type = { json = "$.resource_type", type = "Utf8" }
name = { json = "$.name", type = "Utf8" }

[table.filters]
limit = { param = "limit" }
offset = { param = "offset" }
