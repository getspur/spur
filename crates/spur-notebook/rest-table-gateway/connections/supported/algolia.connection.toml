# Curated Algolia REST manifest for the REST table gateway.
# Source grounding: Nango algolia auth/base metadata + Algolia OpenAPI table shapes.

[source]
name = "algolia"
base_url = "https://${connectionConfig.algolia_app_id}-dsn.algolia.net"
connection_config = ["algolia_app_id"]
auth = { scheme = "header", name = "x-algolia-api-key", env = "ALGOLIA_API_KEY" }

[source.headers]
x-algolia-application-id = "${connectionConfig.algolia_app_id}"

[[table]]
name = "list_indices"
path = "/1/indexes"
response_path = "$.items"

[table.columns]
name = { json = "$.name", type = "Utf8" }
entries = { json = "$.entries", type = "Int64" }
data_size = { json = "$.dataSize", type = "Int64" }
file_size = { json = "$.fileSize", type = "Int64" }
updated_at = { json = "$.updatedAt", type = "Utf8" }
primary = { json = "$.primary", type = "Utf8" }
pending_task = { json = "$.pendingTask", type = "Boolean" }

[table.filters]
hits_per_page = { param = "hitsPerPage" }
page = { param = "page" }
