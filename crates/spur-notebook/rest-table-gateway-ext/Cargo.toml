[package]
name = "spur-rest-table-gateway-ext"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "spur_rest"
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow-array = "58"
arrow-schema = "58"
duckdb = { version = "=1.10502.0", features = ["loadable-extension", "vtab"] }
directories = "5"
serde_json = "1"
spur-rest-table-gateway = { path = "../rest-table-gateway", default-features = false }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
