<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Hero</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}
body { display: grid; place-items: center; background: #071019; }
.hero {
  position: relative; width: 100vw; height: 100vh; display: grid; place-items: center;
  text-align: center; isolation: isolate;
  background: linear-gradient(120deg, #08111f, #0f766e, #155e75, #7c3aed, #111827);
  background-size: 300% 300%;
  animation: liquid 12s ease-in-out infinite;
}
.hero:before, .hero:after {
  content: ""; position: absolute; inset: -18%; z-index: -1; border-radius: 45%;
  filter: blur(46px); opacity: .66; mix-blend-mode: screen;
}
.hero:before {
  background: radial-gradient(circle, #67e8f9, transparent 58%);
  animation: driftA 9s ease-in-out infinite;
}
.hero:after {
  background: radial-gradient(circle, #f0abfc, transparent 60%);
  animation: driftB 11s ease-in-out infinite;
}
.content { width: min(980px, 88vw); padding: 8vh 0; animation: floatIn 1s ease-out both; }
.eyebrow { margin: 0 0 20px; color: #bae6fd; font-size: clamp(15px, 1.8vw, 26px); font-weight: 800; text-transform: uppercase; letter-spacing: .2em; }
h1 { margin: 0; font-size: clamp(58px, 10vw, 150px); line-height: .9; font-weight: 900; letter-spacing: 0; text-shadow: 0 12px 44px rgba(0,0,0,.35); }
.subtext { margin: 28px auto 0; max-width: 760px; color: #e0f2fe; font-size: clamp(18px, 2.2vw, 31px); line-height: 1.36; text-shadow: 0 6px 24px rgba(0,0,0,.25); }
.glow { position: absolute; inset: auto 12vw 10vh 12vw; height: 2px; background: linear-gradient(90deg, transparent, #a7f3d0, #f0abfc, transparent); filter: blur(.2px); animation: pulse 2.8s ease-in-out infinite; }
@keyframes liquid { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@keyframes driftA { 0%, 100% { transform: translate(-8%,2%) rotate(0deg) scale(1); } 50% { transform: translate(12%,-8%) rotate(22deg) scale(1.12); } }
@keyframes driftB { 0%, 100% { transform: translate(10%,-4%) rotate(0deg) scale(.96); } 50% { transform: translate(-12%,10%) rotate(-18deg) scale(1.08); } }
@keyframes floatIn { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes pulse { 0%, 100% { opacity: .35; transform: scaleX(.72); } 50% { opacity: 1; transform: scaleX(1); } }
</style>
</head>
<body>
<main class="hero" aria-label="Animated liquid gradient hero">
  <section class="content">
    <p class="eyebrow">Now entering</p>
    <h1>Fluid Strategy</h1>
    <p class="subtext">A calm, cinematic opener for product narratives, creative briefs, and section transitions.</p>
  </section>
  <div class="glow" aria-hidden="true"></div>
</main>
</body>
</html>
