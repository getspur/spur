[package]
name = "spur-notebook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "spur-notebook"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true, features = ["serde"] }
async-channel = "2"
async-trait = { workspace = true }
blake3 = "1"
chrono.workspace = true
directories.workspace = true
duckdb = { workspace = true, optional = true, features = ["bundled"] }
fs4 = "0.13"
jute = { path = "jute-notebook/src-tauri" }
memmap2 = { workspace = true }
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
spur-core.workspace = true
spur-rest-table-gateway = { path = "rest-table-gateway", default-features = false, optional = true }
tauri = { version = "2.0.4", features = ["devtools", "macos-private-api"] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-fs = "2.2.0"
tauri-plugin-opener = "2.2.3"
tauri-plugin-shell = "2.2.0"
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs = { version = "10.1.0", features = ["chrono-impl", "no-serde-warnings"] }
url = "2.5.0"
uuid.workspace = true

[dev-dependencies]
spur-acp = { path = "../spur-acp" }
tauri = { version = "2.0.4", features = ["test"] }
tempfile = "3"
wiremock = "0.6"

[build-dependencies]
# Required for `tauri::generate_context!()` to embed the frontend dist into the
# binary at compile time. Without this, the .app webview navigates to
# tauri://localhost/index.html and gets nothing back → blank page.
tauri-build = { version = "2", features = [] }

[features]
default = ["datasource-introspect"]
# Tauri 2.0.4 (per tauri/src/lib.rs:338) gates "production mode" on this Cargo
# feature: `!cfg!(feature = "custom-protocol")` means dev. With this feature
# OFF, the runtime tries to load `devUrl` (http://localhost:1420) which doesn't
# exist in the installed bundle → blank page. The `tauri build` CLI sets it
# automatically; we drive `cargo build` directly from xtask, so we must set it
# ourselves. Despite the v2 migration guide claiming this feature is ignored,
# 2.0.4 source clearly checks it (`cfg!(feature = "custom-protocol")`).
custom-protocol = ["tauri/custom-protocol"]
# Pulls in bundled DuckDB for attach-time datasource schema probing — covers
# both DuckDB and SQLite (the latter via DuckDB's runtime sqlite_scanner).
# Default-ON since Scope B shipped; accepts the ~4-min cold bundled-libduckdb
# build. Tests/cheap builds opt out with `--no-default-features`.
datasource-introspect = ["dep:duckdb", "dep:spur-rest-table-gateway"]

[lints]
workspace = true
