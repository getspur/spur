[package]
name = "spur-context-service"
description = "Lambda-served DuckLake code context service"
version = "1.6.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/getspur/spur-releases"

[lib]
path = "src/lib.rs"

[[bin]]
name = "spur-context-service"
path = "src/main.rs"
required-features = ["lambda"]

[[bin]]
name = "spur-context-indexer"
path = "src/bin/index.rs"

[[bin]]
name = "spur-context-worker"
path = "src/bin/worker.rs"
required-features = ["worker"]

[[bin]]
name = "spur-context-worker-lambda"
path = "src/bin/worker_lambda.rs"
required-features = ["worker-lambda"]

[features]
default = []
analyst = []
lambda = ["dep:lambda_runtime"]
worker = []
worker-lambda = ["worker", "dep:lambda_runtime"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
aws-sdk-sfn = "1"
clap = { version = "4", features = ["derive", "env"] }
# DuckDB v1.5.4 (crate 1.10504.0) — DuckLake 1.0 with S3 write support.
# Isolated from the workspace's duckdb v1.4.4 (needed by spur-analyst for DuckPGQ).
duckdb = { version = "=1.10504.0", features = ["bundled"] }
lambda_runtime = { version = "1.2.1", optional = true, features = ["concurrency-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
