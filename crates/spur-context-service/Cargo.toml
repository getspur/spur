[package]
name = "spur-context-service"
description = "Lambda-served DuckLake code context service"
version = "1.6.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/getspur/spur-releases"

[lib]
path = "src/lib.rs"

[[bin]]
name = "spur-context-service"
path = "src/main.rs"
required-features = ["lambda"]

[[bin]]
name = "spur-context-code-lambda"
path = "src/bin/code_lambda.rs"
required-features = ["code-lambda"]

[[bin]]
name = "spur-context-knowledge-lambda"
path = "src/bin/knowledge_lambda.rs"
required-features = ["knowledge-lambda"]

[[bin]]
name = "spur-context-api-key-authorizer"
path = "src/bin/api_key_authorizer.rs"
required-features = ["api-key-authorizer"]

[[bin]]
name = "spur-context-api-key-cleanup"
path = "src/bin/api_key_cleanup.rs"
required-features = ["api-key-cleanup"]

[[bin]]
name = "spur-context-indexer"
path = "src/bin/index.rs"
required-features = ["service"]

[[bin]]
name = "spur-context-worker"
path = "src/bin/worker.rs"
required-features = ["worker"]

[[bin]]
name = "spur-context-worker-lambda"
path = "src/bin/worker_lambda.rs"
required-features = ["worker-lambda"]

[features]
default = ["service"]
serving-lambda = ["dep:aws-config", "artifact-cache-s3", "lambda-http"]
code-lambda = [
    "serving-lambda",
    "api-key-authorizer",
    "code-backend",
    "code-control",
]
knowledge-lambda = ["serving-lambda", "api-key-authorizer", "service"]
code-control = ["dep:aws-sdk-sfn", "dep:spur-context-source"]
service = [
    "dep:anyhow",
    "dep:aws-config",
    "artifact-cache-s3",
    "code-backend",
    "dep:aws-sdk-secretsmanager",
    "dep:aws-sdk-sfn",
    "dep:clap",
    "dep:duckdb",
    "dep:spur-context-source",
]
code-backend = ["parquet-io", "dep:spur-graph"]
analyst = ["service"]
artifact-cache-s3 = ["dep:aws-sdk-s3"]
lambda-http = ["dep:lambda_runtime"]
# Temporary compatibility alias until deployment packaging selects the named
# Knowledge binary directly.
lambda = ["knowledge-lambda"]
api-key-authorizer = ["dep:lambda_runtime"]
api-key-cleanup = ["dep:lambda_runtime"]
parquet-io = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet", "dep:sha1"]
worker = ["service", "parquet-io"]
worker-lambda = ["worker", "dep:lambda_runtime"]

[dependencies]
anyhow = { version = "1", optional = true }
arrow-array = { version = "58", optional = true }
arrow-schema = { version = "58", optional = true }
async-trait = "0.1"
aws-config = { version = "1", optional = true }
aws-sdk-dynamodb = "1"
aws-sdk-s3 = { version = "1", optional = true }
aws-sdk-secretsmanager = { version = "1", optional = true }
aws-sdk-sfn = { version = "1", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
# DuckDB v1.5.4 (crate 1.10504.0) — DuckLake 1.0 with S3 write support.
# Isolated from the workspace's duckdb v1.4.4 (needed by spur-analyst for DuckPGQ).
duckdb = { version = "=1.10504.0", features = ["bundled"], optional = true }
lambda_runtime = { version = "1.2.1", optional = true, features = ["concurrency-tokio"] }
parquet = { version = "58", default-features = false, features = ["arrow", "zstd"], optional = true }
rand = "0.8"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", optional = true }
sha2 = "0.10"
spur-context-source = { path = "../spur-context-source", optional = true }
spur-graph = { path = "../spur-graph", default-features = false, optional = true }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

# This crate is excluded from the main workspace (it uses a different duckdb
# version). An empty [workspace] table makes it a standalone workspace root so
# `cargo` does not walk up to the parent workspace and reject it as a
# non-member.
[workspace]
