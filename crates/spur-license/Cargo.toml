[package]
name = "spur-license"
description = "Provider-agnostic licensing facade for SPUR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
licenseseat = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8"] }
base64 = "0.22"
uuid = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
ahash = "0.8"
arc-swap = "1.7"
seahash = "4"

[build-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8"] }
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
proptest = "1"
tempfile = "3"
# Self-reference enables the `test-support` feature for integration tests
# (tests in tests/ compile as separate crates and don't see `cfg(test)` of
# the main lib). Standard Cargo pattern. See `policy/mod.rs:from_document`.
spur-license = { path = ".", features = ["test-support"] }

[features]
test-support = []

[lints]
workspace = true
