[package]
name = "spur-cli"
description = "SPUR CLI binary — entry point for all commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/getspur/spur-releases"

[[bin]]
name = "spur"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[package.metadata.dist]
dist = true

[features]
default = ["embed", "tui-default", "interactive-default"]
duckdb = ["spur-context/duckdb"]
embed = [
    "spur-analyst/embed",
    "spur-core/embed",
    "spur-graph/embed",
    "spur-interactive/core-embed",
    "spur-tui/core-embed",
    "spur-tui/graph-embed",
]
interactive-default = ["spur-interactive/default"]
test-seam = []
worker-no-embed = []
tui-default = ["spur-tui/default"]
# Telegram bot frontend. Off by default: the `spur bot` command, the
# `spur init` Telegram prompt, and the `spur-bot` crate are all compiled
# out unless this feature is enabled. Re-enable with
# `cargo build --features telegram-bot`.
telegram-bot = ["dep:spur-bot"]

[dependencies]
spur-acp = { workspace = true }
spur-blob-store = { workspace = true }
spur-analyst = { workspace = true, default-features = false }
spur-core = { workspace = true, default-features = false }
spur-cost = { workspace = true }
spur-context = { workspace = true }
spur-graph = { workspace = true, default-features = false }
spur-mcp = { workspace = true }
spur-pm = { workspace = true }
spur-license = { workspace = true }
spur-tui = { workspace = true, default-features = false }
spur-interactive = { workspace = true, default-features = false }
spur-bot = { workspace = true, optional = true }
spur-worktree = { workspace = true }
spur-telemetry = { path = "../spur-telemetry" }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
nix = { version = "0.29", features = ["resource"] }
directories = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
duckdb = { workspace = true }
file-rotate = "0.8"
indicatif = "0.18"
# rustls provider for octocrab's TLS handshake — see main.rs for the
# install_default() call. `ring` keeps us off the heavier `aws-lc-rs`.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3"
lancedb = { workspace = true }
spur-license = { workspace = true, features = ["test-support"] }
spur-pm = { workspace = true, features = ["test-helpers"] }
tokio = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
assert_cmd = "2"
uuid = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true
