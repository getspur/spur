[package]
name = "spur-cli"
description = "SPUR CLI binary — entry point for all commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/getspur/spur-releases"

[[bin]]
name = "spur"
path = "src/main.rs"

[dependencies]
spur-acp = { workspace = true }
spur-core = { workspace = true }
spur-cost = { workspace = true }
spur-pm = { workspace = true }
spur-tui = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }

[dev-dependencies]
tempfile = "3"
