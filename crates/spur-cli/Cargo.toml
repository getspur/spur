[package]
name = "spur-cli"
description = "SPUR CLI binary — entry point for all commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/getspur/spur-releases"

[[bin]]
name = "spur"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = []
duckdb = ["spur-context/duckdb"]
test-seam = []

[dependencies]
spur-acp = { workspace = true }
spur-blob-store = { workspace = true }
spur-core = { workspace = true }
spur-cost = { workspace = true }
spur-context = { workspace = true }
spur-graph = { workspace = true }
spur-pm = { workspace = true }
spur-license = { workspace = true }
spur-tui = { workspace = true }
spur-interactive = { workspace = true }
spur-bot = { workspace = true }
spur-worktree = { workspace = true }
spur-telemetry = { path = "../spur-telemetry" }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
file-rotate = "0.8"
# rustls provider for octocrab's TLS handshake — see main.rs for the
# install_default() call. `ring` keeps us off the heavier `aws-lc-rs`.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3"
spur-license = { workspace = true, features = ["test-support"] }
spur-pm = { workspace = true, features = ["test-helpers"] }
tokio = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
assert_cmd = "2"
uuid = { workspace = true }
