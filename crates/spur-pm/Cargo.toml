[package]
name = "spur-pm"
description = "PM tool adapters — GitHub Issues via gh CLI (Phase 1), Linear and Plane (Phase 3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
fs2 = "0.4"
libc = "0.2"
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
beads_rust = { git = "https://github.com/getspur/beads_rust", rev = "08dabbb0a558215858d658fca0d426906bac63ba", default-features = false }
petgraph = { workspace = true }
semver = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
