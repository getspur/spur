[package]
name = "spur-pm"
description = "PM tool adapters — GitHub Issues via gh CLI (Phase 1), Linear and Plane (Phase 3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
fs2 = "0.4"
libc = "0.2"
rusqlite = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
beads_rust = { git = "https://github.com/getspur/beads_rust", rev = "543495d5c52c9996acfea8c534708b6009bbe22e", default-features = false }
petgraph = { workspace = true }
semver = "1"
tempfile = "3"

[dev-dependencies]
fsqlite = "0.1.2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
