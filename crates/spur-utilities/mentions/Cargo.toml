[package]
name = "spur-mentions"
description = "Neutral mention completion engine (no ACP types; optional `code` feature pulls spur-graph)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
code = ["dep:spur-graph", "dep:anyhow"]

[dependencies]
spur-graph = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
nucleo-matcher = { workspace = true }
ignore = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
proptest = { workspace = true }

[[bench]]
name = "rank_top_k"
harness = false

[[bench]]
name = "file_build"
harness = false

[lints]
workspace = true
