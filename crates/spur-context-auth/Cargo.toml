[package]
name = "spur-context-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
keyring = { version = "3.6", features = [
    "apple-native",
    "crypto-rust",
    "linux-native-sync-persistent",
    # Build libdbus from source and link it statically (crypto-rust means no
    # openssl side effect). The zigbuild linux-x86_64 cross leg has no x86_64
    # system libdbus/pkg-config sysroot, and a static libdbus also drops the
    # libdbus-1.so.3 runtime requirement from released linux binaries.
    "vendored",
    "windows-native",
] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest.workspace = true
secrecy = "0.10"
serde.workspace = true
serde_json.workspace = true
subtle = "2"
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
url = "2"

[target.'cfg(windows)'.dependencies]
nt-token = "0.5"
windows = { version = "0.61", features = ["Win32_Security"] }
windows-permissions = "0.2.4"

[dev-dependencies]
base64 = "0.22"
jsonwebtoken = "9"
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
sha2.workspace = true
wiremock = "0.6"

[lints]
workspace = true
