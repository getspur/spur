[package]
name = "spur-mcp"
description = "MCP callback server exposing delegation tools for brain agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64ct = { version = "1", features = ["alloc"] }
chrono = { workspace = true }
futures = { workspace = true }
hmac = "0.12"
parking_lot = "0.12"
rand = "0.8"
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
spur-acp = { workspace = true }
spur-blob-store = { workspace = true }
spur-license = { workspace = true }
spur-pm = { workspace = true }
spur-worktree = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[features]
default = []
# Enables OutcomeMaterializer cap-override builders for tests in
# downstream crates. spur-blob-store has the same feature for its
# MockFailingOutcomeStore (Task 3).
test-support = []

[dev-dependencies]
agent-client-protocol = { workspace = true }
proptest = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
spur-blob-store = { workspace = true, features = ["test-support"] }
spur-core = { workspace = true }
spur-license = { workspace = true, features = ["test-support"] }
spur-mcp = { path = ".", features = ["test-support"] }
tempfile = "3"
# start_paused = true on #[tokio::test] requires test-util feature.
tokio = { version = "1", features = ["full", "test-util"] }
toml = { workspace = true }
