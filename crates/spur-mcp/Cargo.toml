[package]
name = "spur-mcp"
description = "MCP callback server exposing delegation tools for brain agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
schemars = { workspace = true }
spur-acp = { workspace = true }
spur-pm = { workspace = true }
spur-worktree = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
axum = { workspace = true }
rmcp = { workspace = true }
parking_lot = "0.12"

[dev-dependencies]
toml = { workspace = true }
chrono = { workspace = true }
tempfile = "3"
# start_paused = true on #[tokio::test] requires test-util feature.
tokio = { version = "1", features = ["full", "test-util"] }
