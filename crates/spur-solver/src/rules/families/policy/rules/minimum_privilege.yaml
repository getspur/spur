schema_version: 1
id: rbac.minimum_privilege
rule_version: 1
family: policy
profile: nist_rbac
primitive: minimum_privilege
summary: Prefer fewer grants while preserving explicitly declared required permissions.
availability: capability_unavailable
availability_reason: minimum privilege requires caller-owned utility requirements and an optimization objective
strength: advisory
authorities:
  - kind: nist_standard_model
    title: NIST Role Based Access Control
    url: https://csrc.nist.gov/Projects/role-based-access-control/faqs
requires:
