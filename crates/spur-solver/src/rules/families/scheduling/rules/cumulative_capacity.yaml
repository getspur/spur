schema_version: 1
id: scheduling.cumulative_capacity
rule_version: 1
family: scheduling
profile: finite_horizon
primitive: time_indexed_cumulative_capacity
summary: Keep every declared resource's concurrent non-preemptive demand within one machine's capacity at every horizon tick.
availability: implemented
strength: hard
authorities:
  - kind: official_constraint_language_documentation
    title: MiniZinc Scheduling Constraints
    url: https://docs.minizinc.dev/en/2.9.2/lib-globals-scheduling.html
  - kind: operations_research_paper
    title: "Multiproject Scheduling with Limited Resources: A Zero-One Programming Approach"
    url: https://doi.org/10.1287/mnsc.16.1.93
requires:
  - horizon
  - jobs[].durations
  - jobs[].demands
  - jobs[].assignment
  - machines[].capacities
llm_encoding:
  effectiveness: high
  problem_shapes:
    - Concurrent jobs on one machine consume finite integer resource capacities over discrete ticks.
  encode_steps:
    - Bind exactly one declared machine ID as the subject.
    - For every declared resource and horizon tick, select placements active at that tick.
    - Require the sum of each active job demand times its zero-one placement to fit machine capacity.
  anti_patterns:
    - Do not check only job start ticks; demand applies throughout each half-open execution interval.
    - Do not infer undeclared resources, fractional ticks, or dynamic capacity.
  escalate_when:
    - Escalate preemption, variable demand profiles, or calendar-dependent capacity to a richer scheduling model.
solver_encoding:
  theory: QF_LIA
  verification: assert every per-resource per-tick capacity inequality over observed assignments
  synthesis: enforce every capacity inequality over explicitly declared bounded assignment unknowns
  formula:
    - "for every machine m, resource r, and tick tau: sum demand(j,r) * placement(j,m,t) where t <= tau < t + duration(j,m) <= capacity(m,r)"
subjects:
  cardinality:
    kind: exact
    count: 1
parameters: []
handler: scheduling_cumulative_capacity
examples:
  valid:
    facts:
      family: scheduling
      mode: verify
      rules:
        - rule_id: scheduling.cumulative_capacity
          subjects: [m1]
          parameters: {}
      facts:
        horizon: 4
        jobs:
          a:
            release: 0
            deadline: 4
            durations: {m1: 2}
            eligible_machines: [m1]
            demands: {cpu: 1}
            assignment: {machine: m1, start: 0}
          b:
            release: 0
            deadline: 4
            durations: {m1: 2}
            eligible_machines: [m1]
            demands: {cpu: 1}
            assignment: {machine: m1, start: 2}
        machines:
          m1: {capacities: {cpu: 1}}
        precedence: []
      unknowns: []
    expectation: pass
  invalid:
    facts:
      family: scheduling
      mode: verify
      rules:
        - rule_id: scheduling.cumulative_capacity
          subjects: [m1]
          parameters: {}
      facts:
        horizon: 4
        jobs:
          a:
            release: 0
            deadline: 4
            durations: {m1: 2}
            eligible_machines: [m1]
            demands: {cpu: 1}
            assignment: {machine: m1, start: 0}
          b:
            release: 0
            deadline: 4
            durations: {m1: 2}
            eligible_machines: [m1]
            demands: {cpu: 1}
            assignment: {machine: m1, start: 1}
        machines:
          m1: {capacities: {cpu: 1}}
        precedence: []
      unknowns: []
    expectation: counterexample
    expected_diagnostic: scheduling.cumulative_capacity.violation
conformance:
  valid:
    - name: unit-capacity jobs use disjoint half-open intervals
      request:
        family: scheduling
        mode: verify
        rules:
          - rule_id: scheduling.cumulative_capacity
            subjects: [m1]
            parameters: {}
        facts:
          horizon: 4
          jobs:
            a:
              release: 0
              deadline: 4
              durations: {m1: 2}
              eligible_machines: [m1]
              demands: {cpu: 1}
              assignment: {machine: m1, start: 0}
            b:
              release: 0
              deadline: 4
              durations: {m1: 2}
              eligible_machines: [m1]
              demands: {cpu: 1}
              assignment: {machine: m1, start: 2}
          machines:
            m1: {capacities: {cpu: 1}}
          precedence: []
        unknowns: []
  invalid:
    - name: overlapping unit-demand jobs exceed unit capacity
      request:
        family: scheduling
        mode: verify
        rules:
          - rule_id: scheduling.cumulative_capacity
            subjects: [m1]
            parameters: {}
        facts:
          horizon: 4
          jobs:
            a:
              release: 0
              deadline: 4
              durations: {m1: 2}
              eligible_machines: [m1]
              demands: {cpu: 1}
              assignment: {machine: m1, start: 0}
            b:
              release: 0
              deadline: 4
              durations: {m1: 2}
              eligible_machines: [m1]
              demands: {cpu: 1}
              assignment: {machine: m1, start: 1}
          machines:
            m1: {capacities: {cpu: 1}}
          precedence: []
        unknowns: []
      expected_diagnostic: scheduling.cumulative_capacity.violation
