            subjects: [a, b]
            parameters: {}
        facts:
          horizon: 5
          jobs:
            a:
              release: 0
              deadline: 5
              durations: {m1: 2}
              eligible_machines: [m1]
              demands: {cpu: 1}
              assignment: {machine: m1, start: 0}
            b:
              release: 0
              deadline: 5
              durations: {m2: 2}
              eligible_machines: [m2]
              demands: {cpu: 1}
              assignment: {machine: m2, start: 2}
          machines:
            m1: {capacities: {cpu: 1}}
            m2: {capacities: {cpu: 1}}
          precedence:
            - {before: a, after: b, minimum_lag: 0}
        unknowns: []
  invalid:
    - name: successor starts before predecessor completes
      request:
        family: scheduling
        mode: verify
        rules:
          - rule_id: scheduling.precedence_finish_start
            subjects: [a, b]
            parameters: {}
        facts:
          horizon: 5
          jobs:
            a:
              release: 0
              deadline: 5
              durations: {m1: 2}
              eligible_machines: [m1]
              demands: {cpu: 1}
              assignment: {machine: m1, start: 0}
            b:
              release: 0
              deadline: 5
              durations: {m2: 2}
              eligible_machines: [m2]
              demands: {cpu: 1}
              assignment: {machine: m2, start: 1}
          machines:
            m1: {capacities: {cpu: 1}}
            m2: {capacities: {cpu: 1}}
          precedence:
            - {before: a, after: b, minimum_lag: 0}
        unknowns: []
      expected_diagnostic: scheduling.precedence_finish_start.violation
