schema_version: 1
id: scheduling.minimize_makespan
rule_version: 1
family: scheduling
profile: finite_horizon
primitive: bounded_makespan
summary: Minimize the latest job completion during synthesis or enforce an explicit maximum makespan during verification.
availability: implemented
strength: hard
authorities:
  - kind: official_optimization_documentation
    title: OR-Tools Job Shop Problem
    url: https://developers.google.com/optimization/scheduling/job_shop
  - kind: operations_research_paper
    title: "Multiproject Scheduling with Limited Resources: A Zero-One Programming Approach"
    url: https://doi.org/10.1287/mnsc.16.1.93
requires:
  - horizon
  - jobs[].durations
  - jobs[].assignment
  - parameters.maximum_makespan for verification only
llm_encoding:
  effectiveness: high
  problem_shapes:
    - Optimize the latest completion of a finite set of non-preemptive jobs after hard feasibility rules are declared.
    - Verify a complete observed schedule against one explicit hard maximum makespan.
  encode_steps:
    - Bind every makespan-scoped job ID as a subject and derive each completion from its unique placement.
    - Introduce one bounded integer makespan at least every subject completion.
    - In synthesis emit the typed minimize objective; in verification require maximum_makespan and emit only its hard upper bound.
  anti_patterns:
    - Do not claim optimality from a satisfiable model without complete optimization termination.
    - Do not accept verification without maximum_makespan or silently turn an objective into a hard bound.
  escalate_when:
    - Escalate weighted completion, tardiness, fairness, or multiple objectives to explicit additional objective primitives.
solver_encoding:
  theory: QF_LIA with typed optimization
  verification: require maximum_makespan and assert every complete observed job finishes at or before it
  synthesis: assert makespan bounds then emit the typed minimize objective after hard feasibility constraints
  formula:
    - "makespan >= completion(job) for every subject job"
    - "synthesis objective: minimize makespan"
    - "verification hard rule: makespan <= maximum_makespan"
subjects:
  cardinality:
    kind: at_least
    count: 1
parameters:
  - name: maximum_makespan
    required: false
    kind: integer
    minimum: 0
handler: scheduling_minimize_makespan
examples:
  valid:
    facts:
      family: scheduling
      mode: synthesize
      rules:
        - {rule_id: scheduling.assignment_exactly_once, subjects: [a], parameters: {}}
        - {rule_id: scheduling.assignment_exactly_once, subjects: [b], parameters: {}}
        - {rule_id: scheduling.assignment_exactly_once, subjects: [c], parameters: {}}
        - {rule_id: scheduling.placement_allowed, subjects: [a], parameters: {}}
        - {rule_id: scheduling.placement_allowed, subjects: [b], parameters: {}}
        - {rule_id: scheduling.placement_allowed, subjects: [c], parameters: {}}
        - {rule_id: scheduling.cumulative_capacity, subjects: [m1], parameters: {}}
        - {rule_id: scheduling.cumulative_capacity, subjects: [m2], parameters: {}}
        - {rule_id: scheduling.minimize_makespan, subjects: [a, b, c], parameters: {}}
      facts:
        horizon: 7
        jobs:
          a:
            release: 0
            deadline: 7
            durations: {m1: 3, m2: 3}
            eligible_machines: [m1, m2]
            demands: {cpu: 1}
            assignment: null
          b:
            release: 0
            deadline: 7
            durations: {m1: 2, m2: 2}
            eligible_machines: [m1, m2]
            demands: {cpu: 1}
            assignment: null
          c:
            release: 0
            deadline: 7
            durations: {m1: 2, m2: 2}
            eligible_machines: [m1, m2]
            demands: {cpu: 1}
            assignment: null
        machines:
          m1: {capacities: {cpu: 1}}
          m2: {capacities: {cpu: 1}}
        precedence: []
      unknowns:
        - {kind: assignment, job: a}
        - {kind: assignment, job: b}
        - {kind: assignment, job: c}
    expectation: optimized makespan 4 after complete termination
  invalid:
    facts:
      family: scheduling
      mode: verify
      rules:
        - rule_id: scheduling.minimize_makespan
          subjects: [a, b, c]
          parameters: {maximum_makespan: 3}
      facts:
        horizon: 7
        jobs:
          a:
            release: 0
            deadline: 7
            durations: {m2: 3}
            eligible_machines: [m2]
            demands: {cpu: 1}
            assignment: {machine: m2, start: 0}
          b:
            release: 0
            deadline: 7
            durations: {m1: 2}
            eligible_machines: [m1]
            demands: {cpu: 1}
            assignment: {machine: m1, start: 2}
          c:
            release: 0
            deadline: 7
            durations: {m1: 2}
            eligible_machines: [m1]
            demands: {cpu: 1}
            assignment: {machine: m1, start: 0}
        machines:
          m1: {capacities: {cpu: 1}}
          m2: {capacities: {cpu: 1}}
        precedence: []
      unknowns: []
    expectation: counterexample
    expected_diagnostic: scheduling.minimize_makespan.violation
conformance:
  valid:
    - name: three jobs synthesize a complete optimum of four ticks on two unit-capacity machines
      request:
        family: scheduling
        mode: synthesize
        rules:
          - {rule_id: scheduling.assignment_exactly_once, subjects: [a], parameters: {}}
          - {rule_id: scheduling.assignment_exactly_once, subjects: [b], parameters: {}}
          - {rule_id: scheduling.assignment_exactly_once, subjects: [c], parameters: {}}
          - {rule_id: scheduling.placement_allowed, subjects: [a], parameters: {}}
          - {rule_id: scheduling.placement_allowed, subjects: [b], parameters: {}}
          - {rule_id: scheduling.placement_allowed, subjects: [c], parameters: {}}
          - {rule_id: scheduling.cumulative_capacity, subjects: [m1], parameters: {}}
          - {rule_id: scheduling.cumulative_capacity, subjects: [m2], parameters: {}}
          - {rule_id: scheduling.minimize_makespan, subjects: [a, b, c], parameters: {}}
        facts:
          horizon: 7
          jobs:
            a:
              release: 0
              deadline: 7
              durations: {m1: 3, m2: 3}
              eligible_machines: [m1, m2]
              demands: {cpu: 1}
              assignment: null
            b:
              release: 0
              deadline: 7
              durations: {m1: 2, m2: 2}
              eligible_machines: [m1, m2]
              demands: {cpu: 1}
              assignment: null
            c:
              release: 0
              deadline: 7
              durations: {m1: 2, m2: 2}
              eligible_machines: [m1, m2]
              demands: {cpu: 1}
              assignment: null
          machines:
            m1: {capacities: {cpu: 1}}
            m2: {capacities: {cpu: 1}}
          precedence: []
        unknowns:
          - {kind: assignment, job: a}
          - {kind: assignment, job: b}
          - {kind: assignment, job: c}
  invalid:
    - name: observed four-tick schedule violates a hard three-tick verification bound
      request:
        family: scheduling
        mode: verify
        rules:
          - rule_id: scheduling.minimize_makespan
            subjects: [a, b, c]
            parameters: {maximum_makespan: 3}
        facts:
          horizon: 7
          jobs:
            a:
              release: 0
              deadline: 7
              durations: {m2: 3}
              eligible_machines: [m2]
              demands: {cpu: 1}
              assignment: {machine: m2, start: 0}
            b:
              release: 0
              deadline: 7
              durations: {m1: 2}
              eligible_machines: [m1]
              demands: {cpu: 1}
              assignment: {machine: m1, start: 2}
            c:
              release: 0
              deadline: 7
              durations: {m1: 2}
              eligible_machines: [m1]
              demands: {cpu: 1}
              assignment: {machine: m1, start: 0}
          machines:
            m1: {capacities: {cpu: 1}}
            m2: {capacities: {cpu: 1}}
          precedence: []
        unknowns: []
      expected_diagnostic: scheduling.minimize_makespan.violation
