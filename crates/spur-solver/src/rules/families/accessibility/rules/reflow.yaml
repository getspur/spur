schema_version: 1
id: "a11y.reflow"
rule_version: 1
family: "accessibility"
profile: "wcag_geometry_color"
primitive: "viewport_fit"
summary: "Require the full horizontal content extent to fit the supplied reflow viewport unless a typed exception applies."
availability: "implemented"
strength: "hard"
authorities:
  - kind: "w3c_recommendation"
    title: "Web Content Accessibility Guidelines (WCAG) 2.2"
    url: "https://www.w3.org/TR/WCAG22/"
requires:
  - "content.rect"
  - "viewport.width"
  - "exception.kind"
  - "exception.evidence"
llm_encoding:
  effectiveness: "high"
  problem_shapes:
    - "Require the full horizontal content extent to fit the supplied reflow viewport unless a typed exception applies."
  encode_steps:
    - "Normalize caller facts"
    - "Bind explicit subjects"
    - "Compile the hard predicate"
  anti_patterns:
    - "Do not infer facts from pixels inside the solver"
    - "Do not treat an evidence string as solver-proven evidence"
  escalate_when:
    - "Escalate unions of obscurers or transformed geometry to a geometry preprocessor"
solver_encoding:
  theory: "QF_LIA"
  verification: "assert the predicate over complete normalized facts"
  synthesis: "assert the predicate over explicitly bounded numeric unknowns"
  formula:
    - "exception OR content.x >= 0"
    - "exception OR content.x + content.width <= viewport.width"
subjects:
  cardinality:
    kind: "exact"
    count: 1
parameters:
  - name: "exception"
    kind: "native_object"
    validator: "accessibility_exception"
handler: "a11y_reflow"
examples:
  valid:
    facts:
      viewport_width: 320
      content_x: 0
      content_width: 320
    expectation: "pass"
  invalid:
    facts:
      viewport_width: 320
      content_x: 1
      content_width: 320
    expectation: "counterexample"
    expected_diagnostic: "a11y.reflow.violation"
conformance:
  valid:
    - name: "accepts content at the reflow boundary"
      request:
        family: "accessibility"
        mode: "verify"
        rules:
          - rule_id: "a11y.reflow"
            subjects: ["content"]
            parameters: {}
        scene:
          viewport:
            width: 320
            height: 568
          elements:
            content:
              rect: {x: 0, y: 0, width: 320, height: 568}
        unknowns: []
  invalid:
    - name: "rejects content wider than the reflow viewport"
      request:
        family: "accessibility"
        mode: "verify"
        rules:
          - rule_id: "a11y.reflow"
            subjects: ["content"]
            parameters: {}
        scene:
          viewport:
            width: 320
            height: 568
          elements:
            content:
              rect: {x: 0, y: 0, width: 321, height: 568}
        unknowns: []
