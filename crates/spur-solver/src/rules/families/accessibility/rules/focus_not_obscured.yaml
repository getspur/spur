schema_version: 1
id: "a11y.focus_not_obscured"
rule_version: 1
family: "accessibility"
profile: "wcag_geometry_color"
primitive: "not_fully_contained"
summary: "Require a focused rectangle not to be fully hidden by one supplied obscurer."
availability: "implemented"
strength: "hard"
authorities:
  - kind: "w3c_recommendation"
    title: "Web Content Accessibility Guidelines (WCAG) 2.2"
    url: "https://www.w3.org/TR/WCAG22/"
requires:
  - "focused.rect"
  - "obscurer.rect"
llm_encoding:
  effectiveness: "high"
  problem_shapes:
    - "Require a focused rectangle not to be fully hidden by one supplied obscurer."
  encode_steps:
    - "Normalize caller facts"
    - "Bind explicit subjects"
    - "Compile the hard predicate"
  anti_patterns:
    - "Do not infer facts from pixels inside the solver"
    - "Do not treat an evidence string as solver-proven evidence"
  escalate_when:
    - "Escalate unions of obscurers or transformed geometry to a geometry preprocessor"
solver_encoding:
  theory: "QF_LIA"
  verification: "assert the predicate over complete normalized facts"
  synthesis: "assert the predicate over explicitly bounded numeric unknowns"
  formula:
    - "NOT obscurer.contains(focused)"
subjects:
  cardinality:
    kind: "exact"
    count: 2
handler: "a11y_focus_not_obscured"
examples:
  valid:
    facts:
      focused: [0, 0, 24, 24]
      obscurer: [12, 0, 24, 24]
    expectation: "pass"
  invalid:
    facts:
      focused: [0, 0, 24, 24]
      obscurer: [0, 0, 24, 24]
    expectation: "counterexample"
    expected_diagnostic: "a11y.focus_not_obscured.violation"
conformance:
  valid:
    - name: "accepts a partially visible focused rectangle"
      request:
        family: "accessibility"
        mode: "verify"
        rules:
          - rule_id: "a11y.focus_not_obscured"
            subjects: ["focused", "obscurer"]
            parameters: {}
        scene:
          viewport:
            width: 320
            height: 568
          elements:
            focused:
              rect: {x: 0, y: 0, width: 24, height: 24}
            obscurer:
              rect: {x: 12, y: 0, width: 24, height: 24}
        unknowns: []
  invalid:
    - name: "rejects a fully obscured focused rectangle"
      request:
        family: "accessibility"
        mode: "verify"
        rules:
          - rule_id: "a11y.focus_not_obscured"
            subjects: ["focused", "obscurer"]
            parameters: {}
        scene:
          viewport:
            width: 320
            height: 568
          elements:
            focused:
              rect: {x: 0, y: 0, width: 24, height: 24}
            obscurer:
              rect: {x: 0, y: 0, width: 24, height: 24}
        unknowns: []
