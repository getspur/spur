    - name: active pro row supplies its required region
      request:
        family: data_integrity
        mode: verify
        rules:
          - {rule_id: data_integrity.conditional_required, subjects: [pro_requires_region], parameters: {}}
        facts:
          relations:
            subscriptions:
              fields:
                plan: {kind: enum, values: [free, pro]}
                region: {kind: enum, values: [us, eu]}
              rows:
                account: {active: true, cells: {plan: {present: true, value: pro}, region: {present: true, value: us}}}
          unique_constraints: {}
          foreign_keys: {}
          cardinality_constraints: {}
          value_ranges: {}
          conditional_requirements:
            pro_requires_region: {relation: subscriptions, trigger_field: plan, expected: pro, required_field: region}
          aggregate_balances: {}
          consistency_relations: {}
          temporal_constraints: {}
        unknowns: []
  invalid:
    - name: active pro row omits its required region
      request:
        family: data_integrity
        mode: verify
        rules:
          - {rule_id: data_integrity.conditional_required, subjects: [pro_requires_region], parameters: {}}
        facts:
          relations:
            subscriptions:
              fields:
                plan: {kind: enum, values: [free, pro]}
                region: {kind: enum, values: [us, eu]}
              rows:
                account: {active: true, cells: {plan: {present: true, value: pro}, region: {present: false, value: null}}}
          unique_constraints: {}
          foreign_keys: {}
          cardinality_constraints: {}
          value_ranges: {}
          conditional_requirements:
            pro_requires_region: {relation: subscriptions, trigger_field: plan, expected: pro, required_field: region}
          aggregate_balances: {}
          consistency_relations: {}
          temporal_constraints: {}
        unknowns: []
      expected_diagnostic: data_integrity.conditional_required.violation
