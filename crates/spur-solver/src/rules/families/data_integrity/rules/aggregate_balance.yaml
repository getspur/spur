schema_version: 1
id: data_integrity.aggregate_balance
rule_version: 1
family: data_integrity
profile: finite_relational_snapshot
primitive: exact_integer_aggregate_balance
summary: Require all declared integer term cells to be present when their rows are active and their checked linear combination to equal one exact integer target.
availability: implemented
strength: hard
authorities:
  - kind: industry_specification
    title: XBRL Calculation Requirements 1.1 - Summation Consistency
    url: https://www.xbrl.org/REQ/calculation-requirements-1.1/REQ-2022-05-25/calculation-requirements-1.1-2022-05-25.html
requires:
  - aggregate_balances[subject].terms
  - aggregate_balances[subject].target
  - relations[term.relation].rows[term.row].cells[term.field]
llm_encoding:
  effectiveness: high
  problem_shapes:
    - A finite explicitly listed set of integer facts must satisfy one exact weighted balance.
  encode_steps:
    - Bind exactly one aggregate-balance definition ID as the subject.
    - Resolve every term to an integer cell and validate each checked integer coefficient.
    - Require each listed cell to be present when its row is active and equate the exact weighted sum to the target.
  anti_patterns:
    - Do not infer decimal tolerance, rounding, units, or undeclared contributing rows.
    - Do not silently filter the explicit term list by row activity when constructing the arithmetic equality.
    - Do not accept coefficient overflow or nonlinear multiplication.
  escalate_when:
    - Escalate decimal arithmetic, tolerance bands, currency conversion, dynamic term discovery, or nonlinear formulas outside this primitive.
solver_encoding:
  theory: QF_LIA
  verification: fix every listed integer cell and assert presence plus exact weighted equality
  synthesis: constrain only explicitly unknown listed cell presence or integer values within their field domains
  formula:
    - "for every listed term t: active(row(t)) implies present(t)"
    - "sum over listed terms t of coefficient(t) * value(t) = target"
subjects:
  cardinality: {kind: exact, count: 1}
parameters: []
handler: data_integrity_aggregate_balance
examples:
  valid:
    facts:
      family: data_integrity
      mode: verify
      rules:
        - {rule_id: data_integrity.aggregate_balance, subjects: [ledger_balance], parameters: {}}
      facts:
        relations:
          ledger:
            fields: {amount: {kind: integer, minimum: -2000, maximum: 2000}}
            rows:
              left: {active: true, cells: {amount: {present: true, value: 100}}}
              delta: {active: true, cells: {amount: {present: true, value: -30}}}
              right: {active: true, cells: {amount: {present: true, value: 70}}}
        unique_constraints: {}
        foreign_keys: {}
        cardinality_constraints: {}
        value_ranges: {}
        conditional_requirements: {}
        aggregate_balances:
          ledger_balance:
            terms:
              - {relation: ledger, row: left, field: amount, coefficient: 1}
              - {relation: ledger, row: delta, field: amount, coefficient: 1}
              - {relation: ledger, row: right, field: amount, coefficient: -1}
            target: 0
        consistency_relations: {}
        temporal_constraints: {}
      unknowns: []
    expectation: exact integer balance 100 plus negative 30 equals 70
  invalid:
    facts:
      family: data_integrity
      mode: verify
      rules:
        - {rule_id: data_integrity.aggregate_balance, subjects: [ledger_balance], parameters: {}}
      facts:
        relations:
          ledger:
            fields: {amount: {kind: integer, minimum: -2000, maximum: 2000}}
            rows:
              left: {active: true, cells: {amount: {present: true, value: 100}}}
              delta: {active: true, cells: {amount: {present: true, value: -30}}}
              right: {active: true, cells: {amount: {present: true, value: 69}}}
        unique_constraints: {}
        foreign_keys: {}
        cardinality_constraints: {}
        value_ranges: {}
        conditional_requirements: {}
        aggregate_balances:
          ledger_balance:
            terms:
              - {relation: ledger, row: left, field: amount, coefficient: 1}
              - {relation: ledger, row: delta, field: amount, coefficient: 1}
              - {relation: ledger, row: right, field: amount, coefficient: -1}
            target: 0
        consistency_relations: {}
        temporal_constraints: {}
      unknowns: []
    expectation: counterexample because 100 plus negative 30 does not equal 69
    expected_diagnostic: data_integrity.aggregate_balance.violation
conformance:
  valid:
    - name: exact ledger terms satisfy one-hundred plus negative-thirty equals seventy
      request:
        family: data_integrity
        mode: verify
        rules:
          - {rule_id: data_integrity.aggregate_balance, subjects: [ledger_balance], parameters: {}}
        facts:
          relations:
            ledger:
              fields: {amount: {kind: integer, minimum: -2000, maximum: 2000}}
              rows:
                left: {active: true, cells: {amount: {present: true, value: 100}}}
                delta: {active: true, cells: {amount: {present: true, value: -30}}}
                right: {active: true, cells: {amount: {present: true, value: 70}}}
          unique_constraints: {}
          foreign_keys: {}
          cardinality_constraints: {}
          value_ranges: {}
          conditional_requirements: {}
          aggregate_balances:
            ledger_balance:
              terms:
                - {relation: ledger, row: left, field: amount, coefficient: 1}
                - {relation: ledger, row: delta, field: amount, coefficient: 1}
                - {relation: ledger, row: right, field: amount, coefficient: -1}
              target: 0
          consistency_relations: {}
          temporal_constraints: {}
        unknowns: []
  invalid:
    - name: off-by-one right term violates the exact integer balance
      request:
        family: data_integrity
        mode: verify
        rules:
          - {rule_id: data_integrity.aggregate_balance, subjects: [ledger_balance], parameters: {}}
        facts:
          relations:
            ledger:
              fields: {amount: {kind: integer, minimum: -2000, maximum: 2000}}
              rows:
                left: {active: true, cells: {amount: {present: true, value: 100}}}
                delta: {active: true, cells: {amount: {present: true, value: -30}}}
                right: {active: true, cells: {amount: {present: true, value: 69}}}
          unique_constraints: {}
          foreign_keys: {}
          cardinality_constraints: {}
          value_ranges: {}
          conditional_requirements: {}
          aggregate_balances:
            ledger_balance:
              terms:
                - {relation: ledger, row: left, field: amount, coefficient: 1}
                - {relation: ledger, row: delta, field: amount, coefficient: 1}
                - {relation: ledger, row: right, field: amount, coefficient: -1}
              target: 0
          consistency_relations: {}
          temporal_constraints: {}
        unknowns: []
      expected_diagnostic: data_integrity.aggregate_balance.violation
