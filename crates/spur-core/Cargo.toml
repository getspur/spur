[package]
name = "spur-core"
description = "Orchestrator engine — drives the brain-worker pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rand = "0.8"
spur-acp = { workspace = true }
spur-mcp = { workspace = true }
spur-pm = { workspace = true }
spur-worktree = { workspace = true }
spur-cost = { workspace = true }
spur-license = { workspace = true }
agent-client-protocol = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
directories = { workspace = true }

[dev-dependencies]
# `start_paused = true` on `#[tokio::test]` + `tokio::time::advance` require
# the `test-util` feature.
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
