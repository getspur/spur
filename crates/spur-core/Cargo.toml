[package]
name = "spur-core"
description = "Orchestrator engine — drives the brain-worker pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = []
test-helpers = []
fault-injection = []

[dependencies]
dashmap = "6"
fs4 = "0.13"
libc = "0.2"
rand = "0.8"
rusqlite = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
spur-acp = { workspace = true }
spur-blob-store = { workspace = true }
spur-mcp = { workspace = true }
spur-pm = { workspace = true }
spur-worktree = { workspace = true }
spur-cost = { workspace = true }
spur-license = { workspace = true }
agent-client-protocol = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
directories = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# `start_paused = true` on `#[tokio::test]` + `tokio::time::advance` require
# the `test-util` feature.
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
spur-license = { workspace = true, features = ["test-support"] }
proptest = "1"
fs4 = "0.13"
criterion = { version = "0.5", features = ["html_reports"] }

[[test]]
name = "shutdown_mcp_server_bounded"
path = "tests/shutdown_mcp_server_bounded.rs"
required-features = ["test-support"]

[[test]]
name = "review_loopback_e2e"
path = "tests/review_loopback_e2e.rs"
required-features = ["test-support"]

[[test]]
name = "review_gate_integration"
path = "tests/review_gate_integration.rs"
required-features = ["test-support"]

[[test]]
name = "retry_reflexion"
path = "tests/retry_reflexion.rs"
required-features = ["test-support"]

[[bench]]
name = "event_replay"
harness = false
