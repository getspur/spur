[package]
name = "spur-graph"
description = "Code graph substrate and typed fact model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autobenches = false

[features]
perf-gates = []

[lib]
bench = false

[dependencies]
anyhow = { workspace = true }
blake3 = "1"
chrono = { workspace = true }
fs2 = "0.4"
gix = { version = "0.77", default-features = false, features = ["max-performance-safe", "revision", "blob-diff"] }
globset = "0.4"
ignore = "0.4.25"
indicatif = "0.18"
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
base64 = "0.22"
lance-index = "6.0.0"
lancedb = "0.29.0"
parquet = { workspace = true, features = ["arrow"] }
petgraph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = "0.10"
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tree-sitter = "0.25"
tree-sitter-cpp = "0.23"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tracing = { workspace = true }

[dev-dependencies]
criterion = "0.5"
futures = { workspace = true }
insta = { workspace = true }
libc = "0.2"
parquet = { workspace = true, features = ["arrow"] }
pretty_assertions = "1"
tempfile = "3"
tracing-subscriber = { workspace = true }

[[bench]]
name = "incremental"
harness = false

[[bench]]
name = "parquet"
harness = false

[[bin]]
name = "capture-baselines"
path = "benches/capture_baselines.rs"

# Narrow quarantine: keep workspace safety lints active for spur-graph while
# suppressing the measured noisy backlog families. `exit`,
# `undocumented_unsafe_blocks`, `dbg_macro`, `todo`, `unimplemented`,
# `mem_forget`, `transmute_*`, and async-holding lints remain active.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

arc_with_non_send_sync = "deny"
await_holding_invalid_type = "deny"
await_holding_lock = "warn"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
exit = "deny"
future_not_send = "warn"
if_let_mutex = "deny"
infinite_loop = "deny"
mem_forget = "warn"
mutex_integer = "deny"
rc_mutex = "deny"
readonly_write_lock = "deny"
suspicious_command_arg_space = "deny"
todo = "deny"
transmute_ptr_to_ptr = "deny"
unchecked_time_subtraction = "deny"
undocumented_unsafe_blocks = "warn"
unimplemented = "deny"
useless_transmute = "deny"

allow_attributes = "allow"
clone_on_ref_ptr = "allow"
field_reassign_with_default = "allow"
fn_params_excessive_bools = "allow"
format_push_string = "allow"
ignore_without_reason = "allow"
iter_on_single_items = "allow"
iter_over_hash_type = "allow"
manual_let_else = "allow"
map_err_ignore = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
missing_assert_message = "allow"
needless_continue = "allow"
ref_option = "allow"
semicolon_if_nothing_returned = "allow"
unnecessary_wraps = "allow"
useless_let_if_seq = "allow"
