[package]
name = "spur-tui"
description = "Ratatui-based terminal dashboard (Phase 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["markdown"]
markdown = ["dep:tui-markdown", "dep:ratatui-core", "dep:mermaid-rs-renderer", "dep:ratatui-image", "dep:resvg", "dep:pulldown-cmark"]
analytics = ["dep:spur-context", "spur-context/duckdb", "dep:spur-cost", "dep:directories"]

[dependencies]
spur-acp = { workspace = true }
spur-context = { workspace = true, optional = true }
spur-cost = { workspace = true, optional = true }
spur-core = { workspace = true }
spur-pm = { workspace = true }
spur-license = { workspace = true }
agent-client-protocol = { workspace = true }
tokio = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
anyhow = { workspace = true }
arboard = { version = "2", default-features = false, features = ["image-data"] }
base64 = "0.22"
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = "0.0.12"
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = "1"
unicode-width = "0.1"
nucleo-matcher = "0.3"
ignore = "0.4"
tui-textarea = "0.7"
directories = { version = "5", optional = true }
tempfile = "3"

# Markdown + mermaid stack (gated by `markdown` feature)
tui-markdown = { version = "0.3", optional = true }
ratatui-core = { version = "0.1", default-features = false, optional = true }
mermaid-rs-renderer = { version = "0.2.2", default-features = false, features = ["png"], optional = true }
image = { version = "0.25", features = ["png", "jpeg", "webp"] }
ratatui-image = { version = "9", default-features = false, features = ["tokio"], optional = true }
resvg = { version = "0.46", optional = true }
pulldown-cmark = { workspace = true, optional = true }

[dev-dependencies]
spur-core = { path = "../spur-core", features = ["test-helpers"] }
tempfile = "3"
divan = "0.1.21"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "react_trace"
harness = false

[[bench]]
name = "compact_render"
harness = false
