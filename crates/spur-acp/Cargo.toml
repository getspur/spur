[package]
name = "spur-acp"
description = "ACP client, AgentTransport trait, agent registry, and shared types for SPUR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
schemars = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
pin-project-lite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
directories = { workspace = true }
agent-client-protocol = { workspace = true }
tracing-appender = { workspace = true }
spur-pm = { workspace = true }
file-rotate = "0.8"
fs4 = "0.13"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
# /proc reads are pure std::fs; no extra dep needed.

[dev-dependencies]
spur-acp = { path = ".", features = ["test-support"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[[example]]
name = "compat_spike"
path = "examples/compat_spike.rs"
