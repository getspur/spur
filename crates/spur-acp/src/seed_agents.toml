# Seed agents for `spur init`. Same schema as .spur/config.toml.
#
# `spur init` parses this, scans $PATH for each `command`, and registers
# matching entries into the in-memory AgentRegistry. The CLI then writes
# that registry to .spur/config.toml as the user's starting config.
#
# IMPORTANT: `spur init` OVERWRITES .spur/config.toml. If you've
# customized your config, edit it by hand rather than re-running init.
#
# To add a new seed agent: append an [[agents.entries]] block below. No
# Rust changes are required. See docs/spur/agent-onboarding-cookbook.md.

# ── kiro ──────────────────────────────────────────────────────────
[[agents.entries]]
name = "kiro"
command = "kiro-cli"
args = ["acp"]
transport = "acp"
kind = "kiro"
role = "both"
cost_tier = "medium"

[agents.entries.display]
handle = "kiro"

[agents.entries.commands]
dispatch = "prompt_text"

[[agents.entries.commands.ingest]]
method = "_kiro.dev/commands/available"
parser = "json_path_list"
path = "commands"
item_schema = "acp_available_command"

[agents.entries.permissions]
args = ["--trust-all-tools"]

# ── claude-code ───────────────────────────────────────────────────
[[agents.entries]]
name = "claude-code"
command = "npx"
args = ["--yes", "@agentclientprotocol/claude-agent-acp@0.26.0"]
transport = "acp"
kind = "claude-code-acp"
role = "both"
cost_tier = "medium"

[agents.entries.display]
handle = "claude"

[agents.entries.commands]
dispatch = "prompt_text"

[agents.entries.permissions]
session_mode = "bypassPermissions"

# ── codex-bin (via zed-industries/codex-acp, direct binary) ───────────
# Rust binary that bridges OpenAI Codex runtime with ACP over stdio.
# Install: https://github.com/zed-industries/codex-acp/releases
# Or: npx @zed-industries/codex-acp (see codex entry below).
[[agents.entries]]
name = "codex-bin"
command = "codex-acp"
args = []
transport = "acp"
kind = "codex-acp"
role = "both"
cost_tier = "low"

[agents.entries.display]
handle = "codex"

[agents.entries.commands]
dispatch = "prompt_text"

# ── codex (npx wrapper, version-pinned) ──────────────────────
# Same agent as above but via npx — no pre-installed binary needed.
# Pinned version is critical: @latest would silently pull breaking
# changes mid-session. Bump deliberately and retest after each bump.
[[agents.entries]]
name = "codex"
command = "npx"
args = ["--yes", "@zed-industries/codex-acp@0.11.1"]
transport = "acp"
kind = "codex-acp"
role = "both"
cost_tier = "low"

[agents.entries.display]
handle = "codex"

[agents.entries.commands]
dispatch = "prompt_text"

[[agents.entries.commands.static]]
name = "review"
description = "Review current changes and find issues"
hint = "[optional instructions]"

[[agents.entries.commands.static]]
name = "review-branch"
description = "Review code changes against a specific branch"
hint = "[branch name]"

[[agents.entries.commands.static]]
name = "review-commit"
description = "Review code changes introduced by a commit"
hint = "[commit sha]"

[[agents.entries.commands.static]]
name = "init"
description = "Create an AGENTS.md with repository guidance"

[[agents.entries.commands.static]]
name = "compact"
description = "Summarize conversation to prevent hitting context limit"

[[agents.entries.commands.static]]
name = "undo"
description = "Undo Codex's most recent turn"

[[agents.entries.commands.static]]
name = "logout"
description = "Logout of Codex"

# ── gemini ────────────────────────────────────────────────────────
[[agents.entries]]
name = "gemini"
command = "gemini"
args = ["--acp", "-y", "-m", "deep-thinker"]
transport = "acp"
kind = "gemini"
role = "both"
cost_tier = "low"

[agents.entries.display]
handle = "gemini"

[agents.entries.commands]
dispatch = "prompt_text"

# ── opencode ──────────────────────────────────────────────────────
[[agents.entries]]
name = "opencode"
command = "opencode"
args = ["-m", "openrouter/z-ai/glm-5.1", "acp"]
transport = "acp"
kind = "generic"
role = "both"
cost_tier = "medium"

[agents.entries.display]
handle = "opencode"

[agents.entries.commands]
dispatch = "prompt_text"


# ── kimi ──────────────────────────────────────────────────────────
# `-y --afk` must precede `acp`. `-y` covers file tools but not shell exec (L2 perm_tx=None → auto_approve handles residual). `--afk` is required on kimi 1.40.0+ — `-y` alone silences agent_message_chunk in ACP mode. R3 warn is intentional.
[[agents.entries]]
name = "kimi"
command = "kimi"
args = ["-y", "--afk", "acp"]
transport = "acp"
kind = "kimi"
role = "both"
cost_tier = "medium"

[agents.entries.display]
handle = "kimi"

[agents.entries.commands]
dispatch = "prompt_text"

[agents.entries.permissions]
skip = true
