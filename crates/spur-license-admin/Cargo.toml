[package]
name = "spur-license-admin"
description = "Admin CLI for LicenseSeat license management and SPUR policy signing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "spur-license-admin"
path = "src/main.rs"

[package.metadata.dist]
dist = false

[dependencies]
spur-license = { path = "../spur-license" }

tokio = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8", "pem", "rand_core"] }
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
