<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, height=720, initial-scale=1">
  <title>Liquid Hero</title>
  <script src="./gsap.min.js"></script>
  <style>
    :root,
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050b17;
    }

    body {
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      color: #e6eefb;
    }

    #main {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 10%, #1e3a8a 0%, transparent 44%),
                  radial-gradient(circle at 90% 85%, #7c3aed 0%, transparent 38%),
                  linear-gradient(120deg, #040b14 0%, #0f172a 45%, #0f172a 100%);
      isolation: isolate;
    }

    .halo {
      position: absolute;
      inset: -20%;
      width: 140%;
      height: 140%;
      background: conic-gradient(from 180deg at 50% 50%, #22d3ee, #a78bfa, #34d399, #22d3ee);
      opacity: 0.33;
      filter: blur(40px);
      transform-origin: center;
      mix-blend-mode: screen;
    }

    .hero-copy {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 8vw;
      max-width: 80%;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.24em;
      font-size: clamp(13px, 1.35vw, 16px);
      margin-bottom: 14px;
      color: #7dd3fc;
    }

    .headline {
      margin: 0;
      line-height: 1.04;
      font-weight: 700;
      font-size: clamp(42px, 5.8vw, 88px);
      letter-spacing: 0.02em;
      text-wrap: balance;
      text-shadow: 0 18px 28px rgba(11, 18, 32, 0.45);
      color: #f8fafc;
    }

    .subtext {
      margin-top: 16px;
      margin-bottom: 0;
      font-size: clamp(16px, 2vw, 30px);
      line-height: 1.35;
      color: #c7d2fe;
      max-width: min(860px, 86vw);
      text-wrap: balance;
      opacity: 0.92;
    }

    .accent {
      position: absolute;
      left: 38%;
      top: 30%;
      width: 34vmax;
      height: 34vmax;
      border-radius: 50%;
      background: radial-gradient(circle at 45% 45%, rgba(56, 189, 248, 0.58), transparent 58%);
      filter: blur(3px);
      transform: translate(-50%, -50%);
      z-index: 1;
      opacity: 0.8;
    }

    .line {
      position: absolute;
      width: min(66vw, 760px);
      height: 2px;
      left: 50%;
      bottom: 16%;
      background: linear-gradient(to right, transparent, #67e8f9, #a78bfa, transparent);
      transform: translateX(-50%) scaleX(0);
      transform-origin: left center;
      filter: blur(0.1px);
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div
    id="main"
    data-composition-id="main"
    data-start="0"
    data-duration="2"
    data-width="1280"
    data-height="720"
  >
    <div class="halo"></div>
    <div class="accent"></div>
    <div class="hero-copy">
      <div class="eyebrow">Liquid Strategy</div>
      <h1 class="headline">Fluid, cinematic introductions for modern narratives.</h1>
      <p class="subtext">A minimal HyperFrames-native hero with GSAP-led motion, DOM styling, and headline-focused pacing.</p>
    </div>
    <div class="line"></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const root = document.getElementById("main");
    const duration = Number.parseFloat(root?.dataset.duration || "2");

    const timeline = gsap.timeline({
      paused: true,
      defaults: {
        ease: "sine.inOut",
      },
    });

    timeline.fromTo(
      ".halo",
      { rotate: -20, opacity: 0.22 },
      { rotate: 26, opacity: 0.54, duration: duration, ease: "none" },
      0,
    );

    timeline.fromTo(
      ".accent",
      { x: "-12%", y: "4%", scale: 0.9, opacity: 0.74, filter: "blur(3px)" },
      {
        x: "28%",
        y: "-16%",
        scale: 1.15,
        opacity: 0.94,
        filter: "blur(2px)",
        duration: duration,
        ease: "power1.inOut",
      },
      0,
    );

    timeline.fromTo(
      ".hero-copy",
      { opacity: 0, y: 28 },
      { opacity: 1, y: 0, duration: 0.72 },
      0.18,
    );

    timeline.fromTo(
      ".line",
      { scaleX: 0 },
      { scaleX: 1, duration: 1.1 },
      0.34,
    );

    timeline.to(
      ".subtext",
      {
        y: -2,
        opacity: 0.85,
        duration: 0.9,
        repeat: -1,
        yoyo: true,
        repeatDelay: 0.12,
      },
      1.2,
    );

    window.__timelines["main"] = timeline;
  </script>
</body>
</html>
