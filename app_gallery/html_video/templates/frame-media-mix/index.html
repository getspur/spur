<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, height=720, initial-scale=1">
  <title>Media Mix</title>
  <script src="./gsap.min.js"></script>
  <style>
    :root,
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050910;
    }

    body {
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: #f3f6ff;
    }

    #main {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .scrim {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(120deg, rgba(3, 7, 18, 0.5), rgba(17, 24, 39, 0.14));
      mix-blend-mode: multiply;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      align-items: center;
      justify-items: center;
      text-align: center;
      padding: 5vh 6vw;
      pointer-events: none;
      box-sizing: border-box;
    }

    .title {
      margin: 0;
      max-width: min(1000px, 80vw);
      font-size: clamp(38px, 5.5vw, 92px);
      line-height: 1.04;
      font-weight: 800;
      letter-spacing: 0.01em;
      text-wrap: balance;
      text-shadow: 0 20px 36px rgba(3, 7, 16, 0.48);
      opacity: 0;
      transform: translateY(20px);
    }

    .kicker {
      margin: 0;
      margin-bottom: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      font-size: clamp(12px, 1.2vw, 18px);
      color: #6ee7ff;
      opacity: 0;
      transform: translateY(-8px);
    }

    .tag {
      margin-top: 1rem;
      font-size: clamp(16px, 2vw, 28px);
      color: #bfdbfe;
      opacity: 0;
      transform: translateY(12px);
    }
  </style>
</head>
<body>
  <div
    id="main"
    data-composition-id="main"
    data-start="0"
    data-duration="3"
    data-width="1280"
    data-height="720"
  >
    <video
      class="clip"
      data-start="0"
      data-duration="3"
      data-track-index="0"
      src="./media/clip.mp4"
      playsinline
    ></video>
    <audio
      data-start="0"
      data-duration="3"
      data-track-index="2"
      data-volume="1"
      src="./media/tone.wav"
    ></audio>
    <div class="scrim" aria-hidden="true"></div>
    <div class="overlay">
      <div>
        <p class="kicker">Native composition mix</p>
        <h1 class="title">Overlay headline over synced video and tone.</h1>
        <p class="tag">GSAP-driven motion, DOM media, and local assets in one composition.</p>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const timeline = gsap.timeline({ paused: true });
    const duration = 3;

    timeline.fromTo(
      ".scrim",
      { opacity: 0.72 },
      { opacity: 0.2, duration: duration, ease: "none" },
      0,
    );

    timeline.fromTo(
      ".kicker",
      { opacity: 0, y: -8 },
      { opacity: 1, y: 0, duration: 0.45, ease: "sine.out" },
      0.2,
    );

    timeline.fromTo(
      ".title",
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
      0.3,
    );

    timeline.fromTo(
      ".tag",
      { opacity: 0, y: 12 },
      { opacity: 0.92, y: 0, duration: 0.52, ease: "expo.out" },
      0.62,
    );

    window.__timelines["main"] = timeline;
  </script>
</body>
</html>
