<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, height=720, initial-scale=1">
  <title>Data Rollup</title>
  <script src="./gsap.min.js"></script>
  <style>
    :root,
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d14;
    }

    #main {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      padding: 36px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 17% 15%, #142038, transparent 50%),
        radial-gradient(circle at 86% 82%, #21122f, transparent 52%),
        linear-gradient(140deg, #070a10 0%, #0b1019 45%, #090b11 100%);
    }

    .panel {
      width: min(1080px, 94vw);
      min-height: min(640px, 84vh);
      padding: clamp(26px, 4vw, 42px);
      border-radius: 22px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: linear-gradient(160deg, rgba(10, 16, 26, 0.85), rgba(16, 23, 36, 0.9));
      box-shadow:
        0 22px 58px rgba(3, 7, 14, 0.5),
        inset 0 0 0 1px rgba(148, 163, 184, 0.09);
      box-sizing: border-box;
      display: grid;
      align-content: start;
      gap: 20px;
    }

    .eyebrow {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      font: 700 14px/1.2 "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: #86e4ff;
    }

    .headline {
      margin: 0;
      font: 700 clamp(40px, 5.6vw, 76px)/1.06 "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      text-wrap: balance;
      letter-spacing: 0.01em;
    }

    .bars {
      display: grid;
      gap: 18px;
      margin-top: 8px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: min(220px, 24vw) 1fr min(90px, 10vw);
      align-items: center;
      gap: 12px;
      column-gap: 14px;
    }

    .label {
      font: 600 28px/1.1 "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: #dbeafe;
      opacity: 0.98;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .value {
      font: 600 24px/1.1 "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: #e2e8f0;
      text-align: right;
      justify-self: end;
      opacity: 0.9;
    }

    .bar-track {
      position: relative;
      height: clamp(24px, 5vw, 40px);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(148, 163, 184, 0.15);
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.14);
      transform-origin: left center;
    }

    .bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--bar-color), #7dd3fc, #a7f3d0);
      transform-origin: left center;
      opacity: 0.96;
    }

    .note {
      margin: 4px 0 0;
      max-width: 88%;
      font: 500 21px/1.35 "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: #b7c0cb;
      text-wrap: balance;
      opacity: 0.88;
    }
  </style>
</head>
<body>
  <div
    id="main"
    data-composition-id="main"
    data-start="0"
    data-duration="2"
    data-width="1280"
    data-height="720"
  >
    <section class="panel">
      <p class="eyebrow">Quarterly rollup</p>
      <h1 class="headline">Momentum by channel</h1>

      <div class="bars">
        <article class="bar-row" data-label="Organic" data-value="82" data-color="#22d3ee">
          <span class="label">Organic</span>
          <div class="bar-track">
            <span class="bar-fill" aria-hidden="true"></span>
          </div>
          <span class="value">82</span>
        </article>

        <article class="bar-row" data-label="Product" data-value="64" data-color="#a7f3d0">
          <span class="label">Product</span>
          <div class="bar-track">
            <span class="bar-fill" aria-hidden="true"></span>
          </div>
          <span class="value">64</span>
        </article>

        <article class="bar-row" data-label="Partners" data-value="47" data-color="#fde047">
          <span class="label">Partners</span>
          <div class="bar-track">
            <span class="bar-fill" aria-hidden="true"></span>
          </div>
          <span class="value">47</span>
        </article>

        <article class="bar-row" data-label="Paid" data-value="38" data-color="#fb7185">
          <span class="label">Paid</span>
          <div class="bar-track">
            <span class="bar-fill" aria-hidden="true"></span>
          </div>
          <span class="value">38</span>
          </article>
      </div>

      <p class="note">Bars settle with per-channel easing while labels and values hold clarity.</p>
    </section>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const root = document.getElementById("main");
    const rows = Array.from(document.querySelectorAll(".bar-row"));
    const rawValues = rows.map((row) => Number.parseFloat(row.dataset.value || "0"));
    const maxValue = Math.max(...rawValues, 1);
    const duration = Number.parseFloat(root?.dataset.duration || "2");

    rows.forEach((row, index) => {
      const value = Number.parseFloat(row.dataset.value || "0");
      const fill = row.querySelector(".bar-fill");
      const percent = Math.min(100, (value / maxValue) * 100);
      const barColor = row.dataset.color || "#22d3ee";
      fill.style.setProperty("--bar-color", barColor);
      fill.style.width = "0%";
      fill.style.opacity = String(0.65 + index * 0.08);
      row.style.opacity = "0";
    });

    const timeline = gsap.timeline({
      paused: true,
      defaults: {
        ease: "power2.out",
      },
    });

    timeline.fromTo(
      ".eyebrow",
      { opacity: 0, y: 8 },
      { opacity: 0.94, y: 0, duration: 0.35 },
      0,
    );

    timeline.fromTo(
      ".headline",
      { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: 0.55 },
      0.14,
    );

    rows.forEach((row, index) => {
      const value = Number.parseFloat(row.dataset.value || "0");
      const fill = row.querySelector(".bar-fill");
      const valueLabel = row.querySelector(".value");
      const percent = Math.min(100, (value / maxValue) * 100);
      const start = 0.34 + index * 0.16;

      timeline.to(
        row,
        { opacity: 1, y: 0, duration: 0.18 },
        start,
      );

      timeline.to(
        fill,
        { width: `${percent}%`, duration: 0.82, ease: "expo.out" },
        start + 0.06,
      );

      timeline.fromTo(
        valueLabel,
        { opacity: 0, x: -8 },
        { opacity: 0.94, x: 0, duration: 0.24 },
        start + 0.34,
      );
    });

    timeline.fromTo(
      ".note",
      { opacity: 0, y: 12 },
      { opacity: 0.94, y: 0, duration: 0.36 },
      duration - 0.4,
    );

    timeline.to(".bar-track", { scaleX: 1, duration: duration, ease: "none" }, 0.3);

    window.__timelines["main"] = timeline;
  </script>
</body>
</html>
