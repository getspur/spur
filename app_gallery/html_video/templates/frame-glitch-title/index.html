<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, height=720, initial-scale=1">
  <title>Glitch Title</title>
  <script src="./gsap.min.js"></script>
  <style>
    :root,
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06070c;
    }

    #main {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: #f8fafc;
      background:
        radial-gradient(circle at 13% 14%, #1a2340, transparent 54%),
        radial-gradient(circle at 88% 84%, #2b1025, transparent 50%),
        linear-gradient(135deg, #070912 0%, #0b0f1f 46%, #070912 100%);
    }

    .noise {
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          to right,
          rgba(255, 255, 255, 0.03) 0px,
          rgba(255, 255, 255, 0.03) 1px,
          transparent 1px,
          transparent 3px
        );
      opacity: 0.15;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .scanline {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 44%, rgba(255, 255, 255, 0.12) 45%, rgba(255, 255, 255, 0) 46%);
      height: 2px;
      transform: translateY(-2px);
      opacity: 0.22;
      pointer-events: none;
    }

    .title-panel {
      position: relative;
      text-align: center;
      width: min(84vw, 1120px);
      display: grid;
      gap: 1rem;
    }

    .kicker {
      text-transform: uppercase;
      letter-spacing: 0.28em;
      font: 700 16px/1.2 "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: #98deff;
      opacity: 0.86;
    }

    .title-wrap {
      position: relative;
      display: grid;
      align-items: center;
      min-height: 180px;
    }

    .title-layer {
      grid-area: 1 / 1;
      margin: 0;
      line-height: 0.95;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      font-weight: 800;
      font-size: clamp(52px, 8.5vw, 140px);
      letter-spacing: 0.03em;
      text-wrap: balance;
      text-shadow: 0 14px 34px rgba(6, 12, 24, 0.55);
      color: #f8fafc;
    }

    .title-layer.glitch-red {
      color: #ff5a79;
      mix-blend-mode: screen;
    }

    .title-layer.glitch-blue {
      color: #3ce5ff;
      mix-blend-mode: screen;
    }

    .footer {
      margin: 0;
      margin-inline: auto;
      max-width: min(760px, 84vw);
      color: #cbd5e1;
      opacity: 0.82;
      font: 500 19px/1.45 "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      text-wrap: balance;
    }
  </style>
</head>
<body>
  <div
    id="main"
    data-composition-id="main"
    data-start="0"
    data-duration="2"
    data-width="1280"
    data-height="720"
  >
    <div class="noise" aria-hidden="true"></div>
    <div class="scanline" aria-hidden="true"></div>
    <div class="title-panel">
      <div class="kicker">Signal Opening</div>
      <div class="title-wrap">
        <h1 class="title-layer glitch-red">SYSTEM SHOCK</h1>
        <h1 class="title-layer glitch-blue">SYSTEM SHOCK</h1>
        <h1 class="title-layer glitch-main">SYSTEM SHOCK</h1>
      </div>
      <p class="footer">A sharp opener for dramatic reveals, chapter breaks, and fast-cut transitions.</p>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const root = document.getElementById("main");
    const duration = Number.parseFloat(root?.dataset.duration || "2");

    const timeline = gsap.timeline({
      paused: true,
      defaults: {
        ease: "power1.out",
      },
    });

    timeline.fromTo(
      ".noise",
      { opacity: 0.02 },
      { opacity: 0.2, duration: duration * 0.95, ease: "none" },
      0,
    );

    timeline.fromTo(
      ".scanline",
      { x: "-110vw", opacity: 0.04 },
      { x: "110vw", opacity: 0.22, duration: 0.08, repeat: 16, ease: "linear" },
      0.08,
    );

    timeline.fromTo(
      ".kicker",
      { opacity: 0, y: 8 },
      { opacity: 0.98, y: 0, duration: 0.45 },
      0.18,
    );

    timeline.fromTo(
      ".title-wrap",
      { opacity: 0, scale: 0.94, y: 24 },
      { opacity: 1, scale: 1, y: 0, duration: 0.55 },
      0.28,
    );

    timeline.fromTo(
      ".title-layer",
      { x: 0, y: 0, opacity: 0.82 },
      { x: 0, y: 0, opacity: 1, duration: 0.3 },
      0.65,
    );

    timeline.set(".glitch-red", { x: 0, y: 0, opacity: 0.9 }, 0.7);
    timeline.set(".glitch-blue", { x: 0, y: 0, opacity: 0.9 }, 0.7);

    timeline.to(".glitch-red", { x: "-8px", y: "3px", duration: 0.04, repeat: 3, yoyo: true, ease: "none" }, 0.72);
    timeline.to(".glitch-blue", { x: "9px", y: "-3px", duration: 0.04, repeat: 3, yoyo: true, ease: "none" }, 0.73);
    timeline.to(".glitch-main", { x: "0px", y: "0px", duration: 0.1, opacity: 1 }, 0.76);

    timeline.to(".title-layer", { x: "1px", y: "-1px", duration: 0.05, repeat: 1, yoyo: true, opacity: 0.92, ease: "steps(2)" }, 0.82);
    timeline.to(".title-layer", { x: "-1px", y: "1px", duration: 0.05, repeat: 1, yoyo: true, opacity: 0.88, ease: "steps(2)" }, 0.88);
    timeline.to(".title-layer", { x: "0px", y: "0px", duration: 0.06, opacity: 1 }, 1);

    timeline.fromTo(".footer", { opacity: 0, y: 12 }, { opacity: 0.94, y: 0, duration: 0.35 }, 1.1);
    timeline.to(".noise", { opacity: 0.09, duration: 0.3 }, 1.4);
    timeline.to([".scanline", ".glitch-red", ".glitch-blue"], { opacity: 0, duration: 0.2 }, 1.8);

    window.__timelines["main"] = timeline;
  </script>
</body>
</html>
