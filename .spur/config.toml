[[agents.entries]]
args = [
    "--no-auto-update",
    "agent",
    "stdio",
]
capabilities = []
command = "grok"
cost_tier = "medium"
kind = "grok"
name = "grok"
role = "both"
skip_permissions = false
skip_permissions_args = []
transport = "acp"

[agents.entries.commands]
args_template = "raw_rest"
dispatch = "prompt_text"
ingest = []
response = []
static = []

[agents.entries.delegation]
avoid_for = []
good_for = []
inherit_defaults = true
limitations = []
strengths = []

[agents.entries.display]
handle = "grok"

[agents.entries.permissions]
args = []
skip = true
mode = 'always-approve'

[agents.entries.review]
max_review_retries = 3
review_required = false
review_timeout_secs = 1800

[agents.entries.review.review_timeout_default.Reject]
reason = "review timeout"

[brain]
fallback = [
    "kiro",
    "codex",
    "gemini",
    "opencode",
    "kimi",
    "grok",
    "claude-code-sj",
]

[context_service]
auth_mode = "oauth_bearer"
profile = "e2e-live"
url = "https://context.getspur.dev"
