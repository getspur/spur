[brain]
# To try the new ACP-based Claude transport, flip `default` to
# "claude-code-acp". Keeping the stream-json one as default during rollout.
default = "claude-code-acp"
fallback = ["claude-code-acp", "kiro"]

[brain.prompt]

# Gemini CLI via native ACP mode. Requires `gemini` on PATH.
# The --acp flag starts Gemini CLI in ACP mode: JSON-RPC 2.0 over stdio.
# Supports initialize, prompt, cancel, setSessionMode, and MCP passthrough.
# Note: Gemini's internal slash commands (/mcp, /compact, etc.) are not
# exposed via ACP — they're REPL-only.
[[agents.entries]]
name = "gemini"
command = "gemini"
args = ["--acp"]
transport = "acp"
role = "both"
capabilities = []
cost_tier = "low"

[agents.entries.permissions]
skip = true

# DEPRECATED: prefer the `claude-code-acp` profile below. This stream-json
# transport is feature-capped (no plan mode, no slash-command discovery,
# no UsageUpdate) and will be removed in a future release. Kept for
# environments without Node.js, which should be rare since Claude Code
# itself requires Node.
[[agents.entries]]
name = "kiro"
command = "kiro-cli"
args = ["acp"]
transport = "acp"
role = "both"
capabilities = []
cost_tier = "medium"

[agents.entries.display]
handle = "kiro"

[agents.entries.commands]
dispatch = "prompt_text"

[[agents.entries.commands.ingest]]
method = "_kiro.dev/commands/available"
parser = "json_path_list"
path = "commands"
item_schema = "acp_available_command"

[agents.entries.permissions]
skip = true
args = ["--trust-all-tools"]

# Claude Code via the upstream ACP wrapper. Preferred transport: gives us
# plan mode, usage tracking, slash-command discovery, and full permission
# gating via the SDK. Requires Node.js on PATH.
#
# The pinned version is critical — @latest would silently pull breaking
# changes mid-session. Bump deliberately and retest after each bump.
[[agents.entries]]
name = "claude-code-acp"
command = "npx"
args = ["--yes", "@agentclientprotocol/claude-agent-acp@0.26.0"]
transport = "acp"
role = "both"
capabilities = []
cost_tier = "medium"

# Codex via zed-industries/codex-acp — ACP adapter for OpenAI Codex.
# Install binary from https://github.com/zed-industries/codex-acp/releases
# or use the codex-acp npx entry below instead.
[[agents.entries]]
name = "codex"
command = "codex-acp"
args = []
transport = "acp"
role = "both"
capabilities = []
cost_tier = "low"

[agents.entries.display]
handle = "codex"

[agents.entries.commands]
dispatch = "prompt_text"

[[agents.entries.commands.static]]
name = "review"
description = "Review current changes and find issues"
hint = "[optional instructions]"

[[agents.entries.commands.static]]
name = "review-branch"
description = "Review code changes against a specific branch"
hint = "[branch name]"

[[agents.entries.commands.static]]
name = "review-commit"
description = "Review code changes introduced by a commit"
hint = "[commit sha]"

[[agents.entries.commands.static]]
name = "init"
description = "Create an AGENTS.md with repository guidance"

[[agents.entries.commands.static]]
name = "compact"
description = "Summarize conversation to prevent hitting context limit"

[[agents.entries.commands.static]]
name = "undo"
description = "Undo Codex's most recent turn"

[[agents.entries.commands.static]]
name = "logout"
description = "Logout of Codex"

[agents.entries.permissions]
skip = true
session_mode = "full-auto"

# Codex via npx wrapper — no pre-installed binary needed, version-pinned.
# Pinned version is critical: @latest would silently pull breaking
# changes mid-session. Bump deliberately and retest after each bump.
[[agents.entries]]
name = "codex"
command = "npx"
args = ["--yes", "@zed-industries/codex-acp@0.11.1"]
transport = "acp"
role = "both"
capabilities = []
cost_tier = "low"

[agents.entries.display]
handle = "codex"

[agents.entries.commands]
dispatch = "prompt_text"

[agents.entries.permissions]
skip = true
session_mode = "full-auto"

[failover]
cooldown_minutes = 30

[worktree]
max_concurrent = 5
stale_cleanup_hours = 24

[cost]
db_path = "~/.spur/cost.db"

[pm]
