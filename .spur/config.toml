max_files = 3
buffered_lines_limit = 8192
child_stderr_buffered_lines_limit = 256
child_stderr_max_bytes = 2621440
child_stderr_max_files = 3
events_max_total_bytes = 67108864
event_replay_horizon_secs = 604800
