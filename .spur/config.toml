[brain]
default = "claude-code"
fallback = [
    "kiro",
    "claude-code-acp",
    "codex-acp",
    "opencode-acp",
    "gemini-acp",
]

[brain.prompt]

[brain.delegation]
framework = "v1"

[[agents.entries]]
name = "claude-code"
command = "claude"
args = [
    "-p",
    "--output-format",
    "stream-json",
    "--verbose",
    "--include-partial-messages",
    "--permission-mode",
    "acceptEdits",
]
transport = "stream-json"
kind = "claude-stream-json"
role = "both"
capabilities = []
cost_tier = "medium"
skip_permissions = false
skip_permissions_args = []

[agents.entries.review]
review_required = false
review_timeout_secs = 1800
max_review_retries = 3

[agents.entries.review.review_timeout_default.Reject]
reason = "review timeout"

[agents.entries.display]
handle = "claude-sj"

[agents.entries.commands]
dispatch = "prompt_text"
args_template = "raw_rest"
ingest = []
response = []
static = []

[agents.entries.permissions]
skip = true
args = ["--dangerously-skip-permissions"]

[agents.entries.delegation]
good_for = []
avoid_for = []
strengths = []
limitations = []
inherit_defaults = true

[[agents.entries]]
name = "kiro"
command = "kiro-cli"
args = ["acp"]
transport = "acp"
kind = "kiro"
role = "both"
capabilities = []
cost_tier = "medium"
skip_permissions = false
skip_permissions_args = []

[agents.entries.review]
review_required = false
review_timeout_secs = 1800
max_review_retries = 3

[agents.entries.review.review_timeout_default.Reject]
reason = "review timeout"

[agents.entries.display]
handle = "kiro"

[agents.entries.commands]
dispatch = "prompt_text"
args_template = "raw_rest"
response = []
static = []

[[agents.entries.commands.ingest]]
method = "_kiro.dev/commands/available"
parser = "json_path_list"
path = "commands"
item_schema = "acp_available_command"

[agents.entries.permissions]
skip = true
args = ["--trust-all-tools"]

[agents.entries.delegation]
good_for = []
avoid_for = []
strengths = []
limitations = []
inherit_defaults = true

